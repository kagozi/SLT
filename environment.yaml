name: slt-multistream
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pip
  # Fix for GLIBCXX / libstdc++ errors on clusters
  - libstdcxx-ng 
  - numpy>=1.23
  - scipy
  - pandas
  - tqdm
  - pyyaml
  - rich
  - click
  - opencv=4.*=*headless*
  - pillow
  - ffmpeg
  - matplotlib
  # Matches PyTorch to a version Transformers 4.40+ accepts
  - pytorch>=2.4.0
  - torchvision
  - torchaudio
  - pytorch-cuda=12.1
  - einops
  - sentencepiece
  - regex
  - scikit-learn
  - sacrebleu
  - nltk
  - jiwer
  - pip:
      - transformers>=4.40.0
      - mediapipe==0.10.14
      - protobuf<5
      - ultralytics>=8.2.0
      - omegaconf
      - hydra-core