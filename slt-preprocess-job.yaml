apiVersion: batch/v1
kind: Job
metadata:
  name: slt-preprocessing
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: preprocess
        image: ghcr.io/kagozi/slt-preprocess:latest
        command: ["/bin/bash", "-c"]
        args:
          - |
            set -e
            echo "Job started on $(date)"
            nvidia-smi

            DATA_ROOT=/data/phoenix2014/PHOENIX-2014-T-release-v3/PHOENIX-2014-T
            OUT_DIR=/data/data_cache

            for SPLIT in train dev test; do
              echo "===== PREPROCESSING $SPLIT ====="

              python -m scripts.preprocess_rgb \
                --data_root "$DATA_ROOT" \
                --output_dir "$OUT_DIR" \
                --split "$SPLIT"

              python -m scripts.preprocess_kpts \
                --data_root "$DATA_ROOT" \
                --output_dir "$OUT_DIR" \
                --split "$SPLIT"

              python -m scripts.preprocess_hands \
                --data_root "$DATA_ROOT" \
                --output_dir "$OUT_DIR" \
                --split "$SPLIT"
            done

            echo "Job finished on $(date)"

        resources:
          requests:
            cpu: "4"
            memory: 24Gi
          limits:
            cpu: "8"
            memory: 32Gi
            nvidia.com/gpu: 1

        volumeMounts:
        - name: slt-data
          mountPath: /data

      volumes:
      - name: slt-data
        persistentVolumeClaim:
          claimName: slt-data