# Experiment 37: PHOENIX-2014-T — Maia-Style Multistream CTC German (Fine-tuned)
#
# Improvement over Maia replication (Exp 36) using multistream + motion.
# PHOENIX counterpart to Exp 35 (How2Sign multistream Maia).
#
# Architecture:
#   --arch interleaved --multistream:
#     Each of the 4 body-part streams (pose/lhand/rhand/face) runs through
#     3 ConformerBlocks (Conv+Transformer pairs, kernels 11/5/11) with per-stream
#     velocity + acceleration features (motion). Streams fused via cross-stream
#     attention, followed by 4 shared TransformerBlocks.
#
# Transfer from Exp 36: only transformer_blocks weights carry over (shared across
# flat→multistream); per-stream projections and ConformerBlocks train from scratch.
#
# Tuned vs Exp 36:
#   - lr: 2e-4  (lower — multistream is larger; also fine-tune regime)
#   - dropout: 0.2  (streams provide structural regularisation)
#   - ctc_smoothing: 0.05
#   - early_stop_patience: 100
#
# Checkpoint saved to: /data/experiments/models/exp37_phoenix_maia_multistream_ctc_german/
apiVersion: batch/v1
kind: Job
metadata:
  name: train-exp37-phoenix-maia-multistream-ctc-german
  namespace: gai-lina-group
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 864000
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: trainer
        image: ghcr.io/kagozi/slt:latest
        command: ["python", "train.py"]
        args:
          - "--dataset"
          - "phoenix"
          - "--root_dir"
          - "/data/phoenix2014/PHOENIX-2014-T-release-v3/PHOENIX-2014-T"
          - "--output_dir"
          - "/data/experiments"
          - "--exp_name"
          - "exp37_phoenix_maia_multistream_ctc_german"
          - "--epochs"
          - "500"
          - "--decode"
          - "beam"
          - "--beam_width"
          - "10"
          - "--batch_size"
          - "8"
          - "--grad_accum"
          - "2"
          - "--fp16"
          - "--dim"
          - "384"
          - "--lr"
          - "2e-4"
          - "--dropout"
          - "0.2"
          - "--num_workers"
          - "4"
          - "--arch"
          - "interleaved"
          - "--multistream"
          - "--phoenix_ctc_target"
          - "translation"
          - "--ffn_expand"
          - "2"
          - "--ctc_smoothing"
          - "0.05"
          - "--early_stop_patience"
          - "100"
        env:
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: wandb-credentials
              key: api-key
        - name: MPLCONFIGDIR
          value: /tmp/matplotlib
        - name: HF_HOME
          value: /data/.hf
        - name: TRANSFORMERS_CACHE
          value: /data/.hf/transformers
        - name: WANDB_CACHE_DIR
          value: /data/.wandb_cache
        resources:
          requests:
            cpu: "2"
            memory: "8Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "2"
            memory: "8Gi"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: slt-data
          mountPath: /data
      volumes:
      - name: slt-data
        persistentVolumeClaim:
          claimName: slt-data
