# Experiment 40: How2Sign — Flat CTC English BPE-1000, fine-tuned from YouTube-ASL (Exp 39)
#
# Fine-tunes the Exp 39 YouTube-ASL checkpoint on How2Sign using the SAME
# BPE-1000 tokenizer trained on YouTube-ASL. This is critical: reusing the
# YouTube-ASL tokenizer (via --bpe_tokenizer_path) ensures the output layer
# has the same meaning across pretraining and fine-tuning.
#
# Pretraining source: Exp 39 (YouTube-ASL flat CTC BPE-1000)
# Tokenizer source:   /data/experiments/models/exp39_youtube_asl_flat_ctc_bpe1000/
#                     bpe_tokenizer_exp39_youtube_asl_flat_ctc_bpe1000.json
#
# Tuned vs Exp 39:
#   - lr: 3e-4  (lower for fine-tuning)
#   - dropout: 0.2
#   - early_stop_patience: 50
#
# Checkpoint saved to: /data/experiments/models/exp40_how2sign_flat_ctc_bpe1000_from_yt/
apiVersion: batch/v1
kind: Job
metadata:
  name: train-exp40-how2sign-flat-ctc-bpe1000-from-yt
  namespace: gai-lina-group
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 864000
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: trainer
        image: ghcr.io/kagozi/slt:latest
        command: ["python", "train.py"]
        args:
          - "--dataset"
          - "how2sign"
          - "--root_dir"
          - "/data/hf_cache/How2Sign_Holistic/how2sign_holistic_features"
          - "--output_dir"
          - "/data/experiments"
          - "--exp_name"
          - "exp40_how2sign_flat_ctc_bpe1000_from_yt"
          - "--epochs"
          - "500"
          - "--decode"
          - "beam"
          - "--beam_width"
          - "10"
          - "--batch_size"
          - "8"
          - "--grad_accum"
          - "2"
          - "--fp16"
          - "--dim"
          - "256"
          - "--lr"
          - "3e-4"
          - "--dropout"
          - "0.2"
          - "--num_workers"
          - "4"
          - "--unglossed_ctc_target"
          - "translation"
          - "--bpe_tokenizer_path"
          - "/data/experiments/models/exp39_youtube_asl_flat_ctc_bpe1000/bpe_tokenizer_exp39_youtube_asl_flat_ctc_bpe1000.json"
          - "--pretrained_path"
          - "/data/experiments/models/exp39_youtube_asl_flat_ctc_bpe1000/best_model.pt"
          - "--freeze_strategy"
          - "none"
          - "--ffn_expand"
          - "4"
          - "--ctc_smoothing"
          - "0.05"
          - "--early_stop_patience"
          - "50"
        env:
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: wandb-credentials
              key: api-key
        - name: MPLCONFIGDIR
          value: /tmp/matplotlib
        - name: HF_HOME
          value: /data/.hf
        - name: TRANSFORMERS_CACHE
          value: /data/.hf/transformers
        - name: WANDB_CACHE_DIR
          value: /data/.wandb_cache
        resources:
          requests:
            cpu: "2"
            memory: "8Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "2"
            memory: "8Gi"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: slt-data
          mountPath: /data
      volumes:
      - name: slt-data
        persistentVolumeClaim:
          claimName: slt-data
