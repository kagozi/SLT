# Visualise a specific PHOENIX-2014-T clip: raw RGB frames + keypoint skeletons.
# Output saved to /data/experiments/figures/ as PNG + PDF.
apiVersion: batch/v1
kind: Job
metadata:
  name: visualize-phoenix
  namespace: gai-lina-group
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: visualizer
        image: ghcr.io/kagozi/slt:latest
        imagePullPolicy: Always
        command: ["python", "visualize_phoenix.py"]
        args:
          - "--root_dir"
          - "/data/phoenix2014/PHOENIX-2014-T-release-v3/PHOENIX-2014-T"
          - "--sequence_npy"
          - "01April_2010_Thursday_heute-6697.npy"
          - "--output_dir"
          - "/data/experiments/figures"
          - "--n_frames"
          - "5"
          - "--dpi"
          - "250"
        resources:
          requests:
            cpu: "2"
            memory: "8Gi"
          limits:
            cpu: "2"
            memory: "8Gi"
        volumeMounts:
        - name: slt-data
          mountPath: /data
      volumes:
      - name: slt-data
        persistentVolumeClaim:
          claimName: slt-data
