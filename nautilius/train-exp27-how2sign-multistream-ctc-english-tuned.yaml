# Experiment 27: How2Sign — Multistream + CTC on English Text (tuned)
#
# Direct replication of Exp 25 (tuned PHOENIX multistream CTC-on-German) on How2Sign.
# Same tuned hyperparameters that fixed Exp 24's training collapse on PHOENIX:
#   - lr: 3e-4 (not 1e-3 — smaller steps for 4× larger multistream model)
#   - early_stop_patience: 100 (not 50 — multistream needs longer to converge)
#   - dropout: 0.2 (not 0.3 — streams provide structural regularization)
#   - ctc_smoothing: 0.05 (not 0.1 — let model build prediction confidence)
#
# Key differences vs Exp 25 (PHOENIX):
#   - dataset: how2sign (ASL) instead of phoenix (DGS)
#   - CTC target: normalized English text (--unglossed_ctc_target translation)
#   - max_frames: 300 (How2Sign default, vs 250 for PHOENIX)
#
# Comparing Exp 26 vs Exp 27 isolates the effect of multistream + motion
# within the CTC-on-text paradigm on How2Sign.
#
# Checkpoint saved to: /data/experiments/models/exp27_how2sign_multistream_ctc_english_tuned/
apiVersion: batch/v1
kind: Job
metadata:
  name: train-exp27-how2sign-multistream-ctc-english-tuned
  namespace: gai-lina-group
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 864000
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: trainer
        image: ghcr.io/kagozi/slt:latest
        command: ["python", "train.py"]
        args:
          - "--dataset"
          - "how2sign"
          - "--root_dir"
          - "/data/hf_cache/How2Sign_Holistic/how2sign_holistic_features"
          - "--output_dir"
          - "/data/experiments"
          - "--exp_name"
          - "exp27_how2sign_multistream_ctc_english_tuned"
          - "--epochs"
          - "500"
          - "--decode"
          - "beam"
          - "--beam_width"
          - "10"
          - "--batch_size"
          - "8"
          - "--grad_accum"
          - "2"
          - "--fp16"
          - "--dim"
          - "256"
          - "--lr"
          - "3e-4"
          - "--dropout"
          - "0.2"
          - "--num_workers"
          - "4"
          - "--multistream"
          - "--unglossed_ctc_target"
          - "translation"
          - "--ffn_expand"
          - "4"
          - "--ctc_smoothing"
          - "0.05"
          - "--early_stop_patience"
          - "100"
        env:
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: wandb-credentials
              key: api-key
        - name: MPLCONFIGDIR
          value: /tmp/matplotlib
        - name: HF_HOME
          value: /data/.hf
        - name: TRANSFORMERS_CACHE
          value: /data/.hf/transformers
        - name: WANDB_CACHE_DIR
          value: /data/.wandb_cache
        resources:
          requests:
            cpu: "2"
            memory: "8Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "2"
            memory: "8Gi"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: slt-data
          mountPath: /data
      volumes:
      - name: slt-data
        persistentVolumeClaim:
          claimName: slt-data
