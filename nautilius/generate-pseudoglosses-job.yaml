# Generates POS-based pseudoglosses for How2Sign using spaCy.
# Writes a PSEUDOGLOSS column into annotations/how2sign_{split}.csv on the PVC.
# Must run AFTER preextract-how2sign-keypoints job completes.
# Must run BEFORE exp5 (How2Sign pseudogloss training). exp4 (glossless) does not need it.
apiVersion: batch/v1
kind: Job
metadata:
  name: generate-pseudoglosses
  namespace: gai-lina-group
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: pseudogloss
        image: ghcr.io/kagozi/slt:latest
        command: ["python", "generate_pseudoglosses_how2sign.py"]
        args:
          - "--root_dir"
          - "/data/how2sign_rgb"
          - "--splits"
          - "train"
          - "val"
          - "test"
        env:
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: wandb-credentials
              key: api-key
        resources:
          requests:
            cpu: "2"
            memory: "8Gi"
          limits:
            cpu: "2"
            memory: "8Gi"
        volumeMounts:
        - name: slt-data
          mountPath: /data
      volumes:
      - name: slt-data
        persistentVolumeClaim:
          claimName: slt-data
