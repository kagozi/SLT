# Generates POS-based pseudoglosses for How2Sign using spaCy.
# NOTE: The realigned CSVs at metadata/how2sign_realigned_{split}.csv do not
# have a PSEUDOGLOSS column. This job adds one. Only needed for exp5/exp6
# (pseudogloss training). Glossless exps (exp4, exp16, exp18) do not need it.
# Reads/writes: /data/hf_cache/How2Sign_Holistic/how2sign_holistic_features/metadata/
apiVersion: batch/v1
kind: Job
metadata:
  name: generate-pseudoglosses
  namespace: gai-lina-group
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: pseudogloss
        image: ghcr.io/kagozi/slt:latest
        command: ["python", "generate_pseudoglosses_how2sign.py"]
        args:
          - "--root_dir"
          - "/data/hf_cache/How2Sign_Holistic/how2sign_holistic_features"
          - "--splits"
          - "train"
          - "val"
          - "test"
        env:
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: wandb-credentials
              key: api-key
        resources:
          requests:
            cpu: "2"
            memory: "8Gi"
          limits:
            cpu: "2"
            memory: "8Gi"
        volumeMounts:
        - name: slt-data
          mountPath: /data
      volumes:
      - name: slt-data
        persistentVolumeClaim:
          claimName: slt-data
