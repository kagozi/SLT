# Experiment 20: YouTube-ASL Pretraining (multistream, keyword CTC + BART)
#
# Pretrains the MultiStreamSignLanguageTransformer on YouTube-ASL
# (~610K ASL-to-English sentences, 984 hours). Uses the same corrected
# English keyword CTC target as How2Sign plus mBART translation.
#
# The saved checkpoint is the pretraining source for Exp 21
# (YouTube-ASL → How2Sign fine-tune), enabling a direct comparison
# against:
#   Exp 18 — How2Sign from scratch
#   Exp 9  — PHOENIX → How2Sign
#   Exp 21 — YouTube-ASL → How2Sign  (expected best)
#
# Depends on: /data/youtube_asl/ populated by download-youtube-asl-job
# Checkpoint saved to: /data/experiments/models/exp20_youtube_asl_pretrain/
apiVersion: batch/v1
kind: Job
metadata:
  name: train-exp20-youtube-asl-pretrain
  namespace: gai-lina-group
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 1036800
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: trainer
        image: ghcr.io/kagozi/slt:latest
        command: ["python", "train.py"]
        args:
          - "--dataset"
          - "youtube_asl"
          - "--root_dir"
          - "/data/youtube_asl"
          - "--output_dir"
          - "/data/experiments"
          - "--exp_name"
          - "exp20_youtube_asl_pretrain"
          - "--epochs"
          - "80"
          - "--decode"
          - "beam"
          - "--beam_width"
          - "4"
          - "--batch_size"
          - "16"
          - "--grad_accum"
          - "2"
          - "--fp16"
          - "--dim"
          - "256"
          - "--max_frames"
          - "300"
          - "--num_workers"
          - "2"
          - "--multistream"
          - "--use_bart"
          - "--ctc_weight"
          - "0.3"
          - "--freeze_bart_epochs"
          - "0"
          - "--ffn_expand"
          - "4"
          - "--lr"
          - "5e-5"
          - "--dropout"
          - "0.3"
          - "--label_smoothing"
          - "0.1"
          - "--contrastive_weight"
          - "0.05"
          - "--ctc_smoothing"
          - "0.0"
          - "--early_stop_patience"
          - "10"
          - "--unglossed_min_freq"
          - "5"
          - "--unglossed_ctc_target"
          - "translation_keywords"
        env:
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: wandb-credentials
              key: api-key
        - name: MPLCONFIGDIR
          value: /tmp/matplotlib
        - name: HF_HOME
          value: /data/.hf
        - name: TRANSFORMERS_CACHE
          value: /data/.hf/transformers
        - name: WANDB_CACHE_DIR
          value: /data/.wandb_cache
        resources:
          requests:
            cpu: "2"
            memory: "9Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "2"
            memory: "10Gi"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: slt-data
          mountPath: /data
      volumes:
      - name: slt-data
        persistentVolumeClaim:
          claimName: slt-data
