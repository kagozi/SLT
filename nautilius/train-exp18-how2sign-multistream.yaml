# Experiment 18: How2Sign — Multi-stream encoder (glossless)
# MultiStreamSignLanguageTransformer with glossless mBART translation.
# Per-stream velocity always included. Contrastive loss (w=0.1) shapes the
# encoder without needing pseudo-glosses.
# Expected: +2-4 BLEU over Exp 4; best How2Sign configuration.
# If Exp 18 >> Exp 16: multi-stream worth the compute for transfer exps.
apiVersion: batch/v1
kind: Job
metadata:
  name: train-exp18-how2sign-multistream
  namespace: gai-lina-group
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: trainer
        image: ghcr.io/kagozi/slt:latest
        command: ["python", "train.py"]
        args:
          - "--dataset"
          - "how2sign"
          - "--root_dir"
          - "/data/how2sign_hf"
          - "--output_dir"
          - "/data/experiments"
          - "--exp_name"
          - "exp18_how2sign_multistream"
          - "--epochs"
          - "200"
          - "--decode"
          - "beam"
          - "--beam_width"
          - "10"
          - "--batch_size"
          - "4"
          - "--grad_accum"
          - "4"
          - "--fp16"
          - "--dim"
          - "256"
          - "--num_workers"
          - "4"
          - "--multistream"
          - "--use_bart"
          - "--ctc_weight"
          - "0.0"
          - "--freeze_bart_epochs"
          - "0"
          - "--ffn_expand"
          - "4"
          - "--label_smoothing"
          - "0.1"
          - "--contrastive_weight"
          - "0.1"
          - "--ctc_smoothing"
          - "0.0"
        env:
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: wandb-credentials
              key: api-key
        resources:
          requests:
            cpu: "4"
            memory: "40Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "4"
            memory: "40Gi"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: slt-data
          mountPath: /data
      volumes:
      - name: slt-data
        persistentVolumeClaim:
          claimName: slt-data
