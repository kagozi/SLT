# Experiment 6: How2Sign — unglossed CTC baseline
# How2Sign has no real glosses, so train CTC on normalized English content-word
# targets from SENTENCE instead of POS pseudo-gloss artifacts.
apiVersion: batch/v1
kind: Job
metadata:
  name: train-exp6-how2sign-sign2gloss
  namespace: gai-lina-group
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: trainer
        image: ghcr.io/kagozi/slt:latest
        command: ["python", "train.py"]
        args:
          - "--dataset"
          - "how2sign"
          - "--root_dir"
          - "/data/hf_cache/How2Sign_Holistic/how2sign_holistic_features"
          - "--output_dir"
          - "/data/experiments"
          - "--exp_name"
          - "exp6_how2sign_sign2gloss"
          - "--epochs"
          - "300"
          - "--decode"
          - "beam"
          - "--beam_width"
          - "10"
          - "--batch_size"
          - "16"
          - "--grad_accum"
          - "2"
          - "--fp16"
          - "--dim"
          - "256"
          - "--max_frames"
          - "300"
          - "--num_workers"
          - "2"
          - "--multistream"
          - "--lr"
          - "2e-4"
          - "--dropout"
          - "0.3"
          - "--unglossed_ctc_target"
          - "translation_keywords"
        env:
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: wandb-credentials
              key: api-key
        resources:
          requests:
            cpu: "1"
            memory: "6Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "1"
            memory: "6Gi"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: slt-data
          mountPath: /data
      volumes:
      - name: slt-data
        persistentVolumeClaim:
          claimName: slt-data
