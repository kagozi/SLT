# Experiment 6: How2Sign — Sign2Gloss (CTC-only, POS pseudo-glosses as labels)
# No BART. Encoder + CTC head trained to recognise pseudo-gloss sequences.
# Run AFTER generate-pseudoglosses job writes PSEUDOGLOSS column to annotations CSVs.
apiVersion: batch/v1
kind: Job
metadata:
  name: train-exp6-how2sign-sign2gloss
  namespace: gai-lina-group
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: trainer
        image: ghcr.io/kagozi/slt:latest
        command: ["python", "train.py"]
        args:
          - "--dataset"
          - "how2sign"
          - "--root_dir"
          - "/data/how2sign_rgb"
          - "--output_dir"
          - "/data/experiments"
          - "--exp_name"
          - "exp6_how2sign_sign2gloss"
          - "--epochs"
          - "200"
          - "--decode"
          - "beam"
          - "--beam_width"
          - "10"
          - "--batch_size"
          - "16"
          - "--dim"
          - "256"
          - "--max_frames"
          - "300"
          - "--num_workers"
          - "4"
        env:
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: wandb-credentials
              key: api-key
        resources:
          requests:
            cpu: "4"
            memory: "16Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "4"
            memory: "16Gi"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: slt-data
          mountPath: /data
      volumes:
      - name: slt-data
        persistentVolumeClaim:
          claimName: slt-data
