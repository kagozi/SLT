# Experiment 16: How2Sign — Enhanced flat encoder (glossless)
# Flat 225-d encoder + velocity features + CTC smoothing disabled (no CTC) +
# contrastive loss (NT-Xent, w=0.1) for encoder regularisation.
# R-Drop omitted (no CTC logits in glossless mode).
# Direct upgrade over Exp 4.
# Contrastive replaces CTC's encoder-shaping role without needing noisy pseudo-glosses.
apiVersion: batch/v1
kind: Job
metadata:
  name: train-exp16-how2sign-enhanced
  namespace: gai-lina-group
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 864000
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: trainer
        image: ghcr.io/kagozi/slt:latest
        command: ["python", "train.py"]
        args:
          - "--dataset"
          - "how2sign"
          - "--root_dir"
          - "/data/hf_cache/How2Sign_Holistic/how2sign_holistic_features"
          - "--output_dir"
          - "/data/experiments"
          - "--exp_name"
          - "exp16_how2sign_enhanced"
          - "--epochs"
          - "500"
          - "--decode"
          - "beam"
          - "--beam_width"
          - "10"
          - "--batch_size"
          - "4"
          - "--grad_accum"
          - "4"
          - "--fp16"
          - "--dim"
          - "256"
          - "--lr"
          - "2e-4"
          - "--dropout"
          - "0.3"
          - "--num_workers"
          - "4"
          - "--use_bart"
          - "--ctc_weight"
          - "0.0"
          - "--freeze_bart_epochs"
          - "0"
          - "--ffn_expand"
          - "4"
          - "--label_smoothing"
          - "0.1"
          - "--use_motion"
          - "--contrastive_weight"
          - "0.05"
          - "--ctc_smoothing"
          - "0.0"
        env:
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: wandb-credentials
              key: api-key
        - name: MPLCONFIGDIR
          value: /tmp/matplotlib
        - name: HF_HOME
          value: /data/.hf
        - name: TRANSFORMERS_CACHE
          value: /data/.hf/transformers
        - name: WANDB_CACHE_DIR
          value: /data/.wandb_cache
        resources:
          requests:
            cpu: "4"
            memory: "32Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "4"
            memory: "32Gi"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: slt-data
          mountPath: /data
      volumes:
      - name: slt-data
        persistentVolumeClaim:
          claimName: slt-data
