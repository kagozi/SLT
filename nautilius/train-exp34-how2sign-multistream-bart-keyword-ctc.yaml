# Experiment 34: How2Sign — Multistream BART with keyword CTC auxiliary
#
# Main replacement for Exp 26/27.  The CTC head learns a compact content-word
# alignment signal, while BART generates the final English sentence and supplies
# the translation BLEU metric that matters for glossless SLT.
apiVersion: batch/v1
kind: Job
metadata:
  name: train-exp34-how2sign-ms-bart-keyword-ctc
  namespace: gai-lina-group
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 864000
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: trainer
        image: ghcr.io/kagozi/slt:latest
        command: ["python", "train.py"]
        args:
          - "--dataset"
          - "how2sign"
          - "--root_dir"
          - "/data/hf_cache/How2Sign_Holistic/how2sign_holistic_features"
          - "--output_dir"
          - "/data/experiments"
          - "--exp_name"
          - "exp34_how2sign_ms_bart_keyword_ctc"
          - "--epochs"
          - "300"
          - "--decode"
          - "beam"
          - "--beam_width"
          - "5"
          - "--batch_size"
          - "4"
          - "--grad_accum"
          - "4"
          - "--dim"
          - "256"
          - "--lr"
          - "1e-4"
          - "--dropout"
          - "0.2"
          - "--num_workers"
          - "4"
          - "--multistream"
          - "--use_bart"
          - "--ctc_weight"
          - "0.2"
          - "--freeze_bart_epochs"
          - "10"
          - "--warmup_bart_epochs"
          - "10"
          - "--unglossed_ctc_target"
          - "translation_keywords"
          - "--unglossed_min_freq"
          - "2"
          - "--ffn_expand"
          - "4"
          - "--ctc_smoothing"
          - "0.02"
          - "--label_smoothing"
          - "0.1"
          - "--joint_encoder_lr_scale"
          - "0.1"
          - "--joint_bart_lr_scale"
          - "0.5"
          - "--early_stop_patience"
          - "60"
        env:
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: wandb-credentials
              key: api-key
        - name: MPLCONFIGDIR
          value: /tmp/matplotlib
        - name: HF_HOME
          value: /data/.hf
        - name: TRANSFORMERS_CACHE
          value: /data/.hf/transformers
        - name: WANDB_CACHE_DIR
          value: /data/.wandb_cache
        resources:
          requests:
            cpu: "2"
            memory: "12Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "2"
            memory: "12Gi"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: slt-data
          mountPath: /data
      volumes:
      - name: slt-data
        persistentVolumeClaim:
          claimName: slt-data
