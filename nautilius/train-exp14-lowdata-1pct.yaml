# Experiment 14: How2Sign — Low-data Transfer (1% training data)
# Pretrained from Exp 1 (PHOENIX Sign2Gloss). Full fine-tune on 1% of How2Sign train set.
# Extreme low-resource scenario: tests whether cross-lingual pretrain enables few-shot SLR.
# Depends on: Exp 1 checkpoint at /data/experiments/exp1_phoenix_sign2gloss/models/best_model.pt
apiVersion: batch/v1
kind: Job
metadata:
  name: train-exp14-lowdata-1pct
  namespace: gai-lina-group
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: trainer
        image: ghcr.io/kagozi/slt:latest
        command: ["python", "train.py"]
        args:
          - "--dataset"
          - "how2sign"
          - "--root_dir"
          - "/data/how2sign_rgb"
          - "--output_dir"
          - "/data/experiments"
          - "--exp_name"
          - "exp14_lowdata_1pct"
          - "--epochs"
          - "100"
          - "--decode"
          - "beam"
          - "--beam_width"
          - "10"
          - "--batch_size"
          - "16"
          - "--dim"
          - "256"
          - "--max_frames"
          - "300"
          - "--num_workers"
          - "4"
          - "--dropout"
          - "0.3"
          - "--pretrained_path"
          - "/data/experiments/models/exp1_phoenix_sign2gloss/best_model.pt"
          - "--freeze_strategy"
          - "none"
          - "--lr"
          - "5e-5"
          - "--subset_pct"
          - "1"
        env:
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: wandb-credentials
              key: api-key
        resources:
          requests:
            cpu: "4"
            memory: "16Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "4"
            memory: "16Gi"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: slt-data
          mountPath: /data
      volumes:
      - name: slt-data
        persistentVolumeClaim:
          claimName: slt-data
