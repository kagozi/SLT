# Priority 3
# Experiment 2: PHOENIX-2014-T — Sign2Gloss2Text (joint CTC + mBART)
# 3-stage training: CTC-only → mBART warmup → full joint.
# Decoder/language are now resolved in code; keep YAML free of model-specific hardcoding.
# Improvements: sacrebleu eval, label_smoothing=0.1, ffn_expand=4.
apiVersion: batch/v1
kind: Job
metadata:
  name: train-exp2-phoenix-sign2gloss2text
  namespace: gai-lina-group
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 864000
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: trainer
        image: ghcr.io/kagozi/slt:latest
        command: ["python", "train.py"]
        args:
          - "--dataset"
          - "phoenix"
          - "--root_dir"
          - "/data/phoenix2014/PHOENIX-2014-T-release-v3/PHOENIX-2014-T"
          - "--output_dir"
          - "/data/experiments"
          - "--exp_name"
          - "exp2_phoenix_sign2gloss2text"
          - "--epochs"
          - "500"
          - "--decode"
          - "beam"
          - "--beam_width"
          - "10"
          - "--batch_size"
          - "1"
          - "--grad_accum"
          - "16"
          - "--fp16"
          - "--dim"
          - "256"
          - "--lr"
          - "3e-4"
          - "--num_workers"
          - "4"
          - "--use_bart"
          - "--ctc_weight"
          - "0.5"
          - "--freeze_bart_epochs"
          - "20"
          - "--warmup_bart_epochs"
          - "20"
          - "--joint_encoder_lr_scale"
          - "0.2"
          - "--joint_bart_lr_scale"
          - "0.5"
          - "--ffn_expand"
          - "4"
          - "--label_smoothing"
          - "0.1"
        env:
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: wandb-credentials
              key: api-key
        - name: MPLCONFIGDIR
          value: /tmp/matplotlib
        - name: HF_HOME
          value: /data/.hf
        - name: TRANSFORMERS_CACHE
          value: /data/.hf/transformers
        - name: WANDB_CACHE_DIR
          value: /data/.wandb_cache
        resources:
          requests:
            cpu: "4"
            memory: "32Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "4"
            memory: "32Gi"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: slt-data
          mountPath: /data
      volumes:
      - name: slt-data
        persistentVolumeClaim:
          claimName: slt-data
