# Transfer Track A2
# Experiment 8: How2Sign — Transfer Learning (ConvBlocks Frozen, multistream)
# Pretrained from Exp 17 (PHOENIX multistream). Stream encoders + low-level fusion
# are frozen; shared transformer blocks + CTC head are fine-tuned.
# Hypothesis: higher-level temporal layers transfer best across sign languages.
# Depends on: Exp 17 checkpoint at /data/experiments/models/exp17_phoenix_multistream/best_exp17_phoenix_multistream.pt
apiVersion: batch/v1
kind: Job
metadata:
  name: train-exp8-transfer-conv-freeze
  namespace: gai-lina-group
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 259200
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: trainer
        image: ghcr.io/kagozi/slt:latest
        command: ["python", "train.py"]
        args:
          - "--dataset"
          - "how2sign"
          - "--root_dir"
          - "/data/hf_cache/How2Sign_Holistic/how2sign_holistic_features"
          - "--output_dir"
          - "/data/experiments"
          - "--exp_name"
          - "exp8_transfer_conv_freeze"
          - "--epochs"
          - "100"
          - "--decode"
          - "beam"
          - "--beam_width"
          - "10"
          - "--batch_size"
          - "16"
          - "--grad_accum"
          - "2"
          - "--fp16"
          - "--dim"
          - "256"
          - "--max_frames"
          - "300"
          - "--num_workers"
          - "2"
          - "--multistream"
          - "--dropout"
          - "0.3"
          - "--pretrained_path"
          - "/data/experiments/models/exp17_phoenix_multistream/best_exp17_phoenix_multistream.pt"
          - "--freeze_strategy"
          - "convblocks"
          - "--lr"
          - "1.5e-4"
        env:
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: wandb-credentials
              key: api-key
        - name: MPLCONFIGDIR
          value: /tmp/matplotlib
        - name: HF_HOME
          value: /data/.hf
        - name: TRANSFORMERS_CACHE
          value: /data/.hf/transformers
        - name: WANDB_CACHE_DIR
          value: /data/.wandb_cache
        resources:
          requests:
            cpu: "1"
            memory: "6Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "1"
            memory: "8Gi"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: slt-data
          mountPath: /data
      volumes:
      - name: slt-data
        persistentVolumeClaim:
          claimName: slt-data
