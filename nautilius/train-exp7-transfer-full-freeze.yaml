# Experiment 7: How2Sign — Transfer Learning (Full Encoder Freeze)
# Pretrained from Exp 1 (PHOENIX Sign2Gloss). Entire encoder frozen.
# Only the CTC head is trained — tests if DGS encoder is useful for ASL without adaptation.
# Depends on: Exp 1 checkpoint at /data/experiments/exp1_phoenix_sign2gloss/models/best_model.pt
apiVersion: batch/v1
kind: Job
metadata:
  name: train-exp7-transfer-full-freeze
  namespace: gai-lina-group
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: trainer
        image: ghcr.io/kagozi/slt:latest
        command: ["python", "train.py"]
        args:
          - "--dataset"
          - "how2sign"
          - "--root_dir"
          - "/data/hf_cache/How2Sign_Holistic/how2sign_holistic_features"
          - "--output_dir"
          - "/data/experiments"
          - "--exp_name"
          - "exp7_transfer_full_freeze"
          - "--epochs"
          - "100"
          - "--decode"
          - "beam"
          - "--beam_width"
          - "10"
          - "--batch_size"
          - "16"
          - "--dim"
          - "256"
          - "--max_frames"
          - "300"
          - "--num_workers"
          - "4"
          - "--dropout"
          - "0.3"
          - "--pretrained_path"
          - "/data/experiments/models/exp1_phoenix_sign2gloss/best_model.pt"
          - "--freeze_strategy"
          - "full"
          - "--lr"
          - "1e-3"
        env:
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: wandb-credentials
              key: api-key
        resources:
          requests:
            cpu: "4"
            memory: "16Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "4"
            memory: "16Gi"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: slt-data
          mountPath: /data
      volumes:
      - name: slt-data
        persistentVolumeClaim:
          claimName: slt-data
