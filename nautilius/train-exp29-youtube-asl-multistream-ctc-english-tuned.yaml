# Experiment 29: YouTube-ASL — Multistream + CTC on English Text (tuned)
#
# Replicates the Exp 25/27 tuned multistream paradigm on YouTube-ASL.
# Same tuned hyperparameters that fixed the Exp 24 collapse on PHOENIX:
#   - lr: 3e-4 (smaller steps for 4× larger multistream model)
#   - dropout: 0.2 (streams provide structural regularization)
#   - ctc_smoothing: 0.05 (build confidence faster)
#   - early_stop_patience: 30 (multistream needs more time; scaled relative to
#     patience=15 for flat, same ratio as Exp 25 vs Exp 26 on PHOENIX)
#
# Serves as:
#   (a) YouTube-ASL standalone multistream CTC baseline
#   (b) Pretraining source for Exp 31 (YouTube-ASL → How2Sign multistream transfer)
#
# Checkpoint saved to: /data/experiments/models/exp29_youtube_asl_multistream_ctc_english_tuned/
apiVersion: batch/v1
kind: Job
metadata:
  name: train-exp29-youtube-asl-multistream-ctc-english-tuned
  namespace: gai-lina-group
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 1036800
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: trainer
        image: ghcr.io/kagozi/slt:latest
        command: ["python", "train.py"]
        args:
          - "--dataset"
          - "youtube_asl"
          - "--root_dir"
          - "/data/youtube_asl"
          - "--output_dir"
          - "/data/experiments"
          - "--exp_name"
          - "exp29_youtube_asl_multistream_ctc_english_tuned"
          - "--epochs"
          - "80"
          - "--decode"
          - "beam"
          - "--beam_width"
          - "10"
          - "--batch_size"
          - "16"
          - "--grad_accum"
          - "2"
          - "--fp16"
          - "--dim"
          - "256"
          - "--max_frames"
          - "300"
          - "--lr"
          - "3e-4"
          - "--dropout"
          - "0.2"
          - "--num_workers"
          - "2"
          - "--multistream"
          - "--unglossed_ctc_target"
          - "translation"
          - "--unglossed_min_freq"
          - "5"
          - "--ffn_expand"
          - "4"
          - "--ctc_smoothing"
          - "0.05"
          - "--early_stop_patience"
          - "30"
        env:
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: wandb-credentials
              key: api-key
        - name: MPLCONFIGDIR
          value: /tmp/matplotlib
        - name: HF_HOME
          value: /data/.hf
        - name: TRANSFORMERS_CACHE
          value: /data/.hf/transformers
        - name: WANDB_CACHE_DIR
          value: /data/.wandb_cache
        resources:
          requests:
            cpu: "2"
            memory: "9Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "2"
            memory: "10Gi"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: slt-data
          mountPath: /data
      volumes:
      - name: slt-data
        persistentVolumeClaim:
          claimName: slt-data
