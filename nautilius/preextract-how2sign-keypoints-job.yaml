# OBSOLETE: Raw holistic npy arrays are now read directly from:
#   /data/hf_cache/How2Sign_Holistic/how2sign_holistic_features/{split}/frontal/
# Landmark selection + normalization happens on-load in dataset_how2sign.py.
# Kept for reference only — do not submit.
apiVersion: batch/v1
kind: Job
metadata:
  name: preextract-how2sign-keypoints
  namespace: gai-lina-group
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: extractor
        image: ghcr.io/kagozi/slt:latest
        command: ["python", "preextract_keypoints_how2sign.py"]
        args:
          - "--root_dir"
          - "/data/how2sign_hf"
          - "--max_frames"
          - "300"
          - "--splits"
          - "train"
          - "val"
          - "test"
        resources:
          requests:
            cpu: "4"
            memory: "16Gi"
          limits:
            cpu: "8"
            memory: "32Gi"
        volumeMounts:
        - name: slt-data
          mountPath: /data
      volumes:
      - name: slt-data
        persistentVolumeClaim:
          claimName: slt-data
