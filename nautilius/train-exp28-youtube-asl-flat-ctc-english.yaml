# Experiment 28: YouTube-ASL — Flat Encoder + CTC on English Text
#
# Replicates the Exp 23/26 CTC-on-text paradigm on YouTube-ASL (~610K samples).
# Flat single-stream encoder, CTC on normalized English translation text.
# No BART decoder — pure CTC, matching the Maia et al. glossless paradigm.
#
# Serves as:
#   (a) YouTube-ASL standalone flat CTC baseline
#   (b) Pretraining source for Exp 30 (YouTube-ASL → How2Sign flat CTC transfer)
#
# unglossed_min_freq=5 keeps vocabulary tractable given the large corpus.
# 80 epochs with patience=15: each epoch covers ~19K gradient steps (610K/32),
# so 80 epochs ≈ 1.5M steps — sufficient for convergence without BART overhead.
#
# Checkpoint saved to: /data/experiments/models/exp28_youtube_asl_flat_ctc_english/
apiVersion: batch/v1
kind: Job
metadata:
  name: train-exp28-youtube-asl-flat-ctc-english
  namespace: gai-lina-group
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 1036800
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: trainer
        image: ghcr.io/kagozi/slt:latest
        command: ["python", "train.py"]
        args:
          - "--dataset"
          - "youtube_asl"
          - "--root_dir"
          - "/data/youtube_asl"
          - "--output_dir"
          - "/data/experiments"
          - "--exp_name"
          - "exp28_youtube_asl_flat_ctc_english"
          - "--epochs"
          - "80"
          - "--decode"
          - "beam"
          - "--beam_width"
          - "10"
          - "--batch_size"
          - "16"
          - "--grad_accum"
          - "2"
          - "--fp16"
          - "--dim"
          - "256"
          - "--max_frames"
          - "300"
          - "--lr"
          - "1e-3"
          - "--dropout"
          - "0.3"
          - "--num_workers"
          - "2"
          - "--unglossed_ctc_target"
          - "translation"
          - "--unglossed_min_freq"
          - "5"
          - "--ffn_expand"
          - "4"
          - "--ctc_smoothing"
          - "0.1"
          - "--early_stop_patience"
          - "15"
        env:
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: wandb-credentials
              key: api-key
        - name: MPLCONFIGDIR
          value: /tmp/matplotlib
        - name: HF_HOME
          value: /data/.hf
        - name: TRANSFORMERS_CACHE
          value: /data/.hf/transformers
        - name: WANDB_CACHE_DIR
          value: /data/.wandb_cache
        resources:
          requests:
            cpu: "2"
            memory: "9Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "2"
            memory: "10Gi"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: slt-data
          mountPath: /data
      volumes:
      - name: slt-data
        persistentVolumeClaim:
          claimName: slt-data
