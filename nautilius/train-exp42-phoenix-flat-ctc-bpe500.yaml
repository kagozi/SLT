# Experiment 42: PHOENIX-2014-T — Flat CTC German with BPE-500 tokenizer
#
# Replicates Exp 23 (Phoenix flat CTC, word-level) but replaces the 3002-token
# word-level German vocabulary with a BPE-500 subword tokenizer.
#
# Motivation (mirroring the How2Sign BPE finding from Exp 38/41):
#   - Exp 23 scored BLEU-4 ≈ 12.8 at word level (3002 tokens). BPE-500 reduces
#     the search space ~6x, making CTC alignment easier.
#   - German morphology is BPE's natural territory: compound words and rich
#     inflection (Niederschlag, Temperaturen, Schneefälle) decompose cleanly into
#     subword units, removing hundreds of low-frequency word types from the vocab.
#   - Expected gain is more modest than How2Sign (which went from BLEU-4 ≈ 0.07
#     to ≈ 0.40) because Phoenix is already a closed weather domain with limited
#     OOV. Still worth validating.
#
# Improvements over Exp 23 (same decoding fixes as Exp 41):
#   - ctc_tokenizer bpe, bpe_vocab_size 500
#   - beam_width 4   (empirically best from Exp 38/41 beam sweep)
#   - length_penalty 1.5  (corrects the over-generation bias seen in Exp 38)
#   - early_stop_patience 30  (Exp 23 best model was at epoch ~50; 50-epoch
#     patience just added wallclock time)
#
# Checkpoint saved to: /data/experiments/models/exp42_phoenix_flat_ctc_bpe500/
apiVersion: batch/v1
kind: Job
metadata:
  name: train-exp42-phoenix-flat-ctc-bpe500
  namespace: gai-lina-group
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 864000
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: trainer
        image: ghcr.io/kagozi/slt:latest
        command: ["python", "train.py"]
        args:
          - "--dataset"
          - "phoenix"
          - "--root_dir"
          - "/data/phoenix2014/PHOENIX-2014-T-release-v3/PHOENIX-2014-T"
          - "--output_dir"
          - "/data/experiments"
          - "--exp_name"
          - "exp42_phoenix_flat_ctc_bpe500"
          - "--epochs"
          - "500"
          - "--decode"
          - "beam"
          - "--beam_width"
          - "4"
          - "--length_penalty"
          - "1.5"
          - "--batch_size"
          - "8"
          - "--grad_accum"
          - "2"
          - "--fp16"
          - "--dim"
          - "256"
          - "--lr"
          - "1e-3"
          - "--dropout"
          - "0.3"
          - "--num_workers"
          - "4"
          - "--phoenix_ctc_target"
          - "translation"
          - "--ctc_tokenizer"
          - "bpe"
          - "--bpe_vocab_size"
          - "500"
          - "--ffn_expand"
          - "4"
          - "--ctc_smoothing"
          - "0.1"
          - "--early_stop_patience"
          - "30"
        env:
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: wandb-credentials
              key: api-key
        - name: MPLCONFIGDIR
          value: /tmp/matplotlib
        - name: HF_HOME
          value: /data/.hf
        - name: TRANSFORMERS_CACHE
          value: /data/.hf/transformers
        - name: WANDB_CACHE_DIR
          value: /data/.wandb_cache
        resources:
          requests:
            cpu: "2"
            memory: "8Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "2"
            memory: "8Gi"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: slt-data
          mountPath: /data
      volumes:
      - name: slt-data
        persistentVolumeClaim:
          claimName: slt-data
