# Experiment 33: How2Sign — Multistream CTC on English keywords
#
# Replacement diagnostic for Exp 27.  Full English sentence CTC collapsed to
# high-frequency words ("you/to/the/and") because CTC has no language decoder
# and the 9.9k-word full-sentence target is too noisy.  This job keeps the
# CTC-only setting but trains on content-word keyword targets, which are a
# better weak gloss proxy for How2Sign.
apiVersion: batch/v1
kind: Job
metadata:
  name: train-exp33-how2sign-ms-ctc-keywords
  namespace: gai-lina-group
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 864000
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: trainer
        image: ghcr.io/kagozi/slt:latest
        command: ["python", "train.py"]
        args:
          - "--dataset"
          - "how2sign"
          - "--root_dir"
          - "/data/hf_cache/How2Sign_Holistic/how2sign_holistic_features"
          - "--output_dir"
          - "/data/experiments"
          - "--exp_name"
          - "exp33_how2sign_ms_ctc_keywords"
          - "--epochs"
          - "300"
          - "--decode"
          - "beam"
          - "--beam_width"
          - "2"
          - "--batch_size"
          - "8"
          - "--grad_accum"
          - "2"
          - "--dim"
          - "256"
          - "--lr"
          - "1e-4"
          - "--dropout"
          - "0.2"
          - "--num_workers"
          - "4"
          - "--multistream"
          - "--unglossed_ctc_target"
          - "translation_keywords"
          - "--unglossed_min_freq"
          - "2"
          - "--ffn_expand"
          - "4"
          - "--ctc_smoothing"
          - "0.02"
          - "--early_stop_patience"
          - "80"
        env:
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: wandb-credentials
              key: api-key
        - name: MPLCONFIGDIR
          value: /tmp/matplotlib
        - name: HF_HOME
          value: /data/.hf
        - name: TRANSFORMERS_CACHE
          value: /data/.hf/transformers
        - name: WANDB_CACHE_DIR
          value: /data/.wandb_cache
        resources:
          requests:
            cpu: "2"
            memory: "8Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "2"
            memory: "8Gi"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: slt-data
          mountPath: /data
      volumes:
      - name: slt-data
        persistentVolumeClaim:
          claimName: slt-data
