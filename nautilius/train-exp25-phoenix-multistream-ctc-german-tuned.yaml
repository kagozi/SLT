# Experiment 25: PHOENIX-2014-T — Multistream + CTC on German Text (tuned)
#
# Tuned version of Exp 24 to fix training collapse.
#
# Exp 24 diagnosis: beam=1 gave BLEU-4=47 but WER=0.96 — a degenerate collapse
# where the model output common German tokens with high 4-gram overlap but no
# true sequence learning. Root causes:
#   1. lr=1e-3 is too aggressive for the 4× larger multistream model
#   2. early_stop_patience=50 cut training before recovery from early minima
#   3. dropout=0.3 over-regularized a model already regularized by stream separation
#   4. ctc_smoothing=0.1 prevented the model from building confidence
#
# Changes vs Exp 24:
#   - lr: 1e-3 → 3e-4      (primary fix; ~4× more conv params needs smaller steps)
#   - early_stop_patience: 50 → 100  (multistream needs longer to converge)
#   - dropout: 0.3 → 0.2   (streams provide structural regularization)
#   - ctc_smoothing: 0.1 → 0.05  (let model build prediction confidence)
#
# Everything else is identical to Exp 24.
# Target: BLEU-4 > 13.96 (Exp 23 test score).
#
# Checkpoint saved to: /data/experiments/models/exp25_phoenix_multistream_ctc_german_tuned/
apiVersion: batch/v1
kind: Job
metadata:
  name: train-exp25-phoenix-multistream-ctc-german-tuned
  namespace: gai-lina-group
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 864000
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: trainer
        image: ghcr.io/kagozi/slt:latest
        command: ["python", "train.py"]
        args:
          - "--dataset"
          - "phoenix"
          - "--root_dir"
          - "/data/phoenix2014/PHOENIX-2014-T-release-v3/PHOENIX-2014-T"
          - "--output_dir"
          - "/data/experiments"
          - "--exp_name"
          - "exp25_phoenix_multistream_ctc_german_tuned"
          - "--epochs"
          - "500"
          - "--decode"
          - "beam"
          - "--beam_width"
          - "10"
          - "--batch_size"
          - "8"
          - "--grad_accum"
          - "2"
          - "--fp16"
          - "--dim"
          - "256"
          - "--lr"
          - "3e-4"
          - "--dropout"
          - "0.2"
          - "--num_workers"
          - "4"
          - "--multistream"
          - "--phoenix_ctc_target"
          - "translation"
          - "--ffn_expand"
          - "4"
          - "--ctc_smoothing"
          - "0.05"
          - "--early_stop_patience"
          - "100"
        env:
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: wandb-credentials
              key: api-key
        - name: MPLCONFIGDIR
          value: /tmp/matplotlib
        - name: HF_HOME
          value: /data/.hf
        - name: TRANSFORMERS_CACHE
          value: /data/.hf/transformers
        - name: WANDB_CACHE_DIR
          value: /data/.wandb_cache
        resources:
          requests:
            cpu: "2"
            memory: "8Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "2"
            memory: "8Gi"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: slt-data
          mountPath: /data
      volumes:
      - name: slt-data
        persistentVolumeClaim:
          claimName: slt-data
