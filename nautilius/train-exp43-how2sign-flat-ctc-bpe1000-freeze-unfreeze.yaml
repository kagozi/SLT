# Experiment 43: How2Sign — Flat CTC BPE-1000, freeze-then-unfreeze fine-tune from YouTube-ASL
#
# Mirrors Exp 40 (YouTube-ASL → How2Sign fine-tune) but uses discriminative
# freeze-then-unfreeze training inspired by SSVP-SLT (Loseille et al., 2024):
#
#   Epochs 0–9 (freeze_encoder_epochs=10):
#     Encoder frozen. Only the CTC head (2 linear layers) is trained.
#     This adapts the output distribution to How2Sign without corrupting the
#     pretrained encoder representations.
#
#   Epoch 10+ (encoder unfrozen):
#     Encoder added to optimizer at LR = 3e-5 (base 3e-4 × scale 0.1).
#     CTC head continues at 3e-4. Both decay on the same cosine schedule.
#     Lower encoder LR prevents catastrophic forgetting of YouTube-ASL features.
#
# Motivation: Exp 40 (full fine-tune from epoch 0) may destroy pretrained
# features too quickly. Freezing for 10 epochs lets the head learn the
# How2Sign label distribution first, then the encoder is gradually adapted.
#
# Differences from Exp 40:
#   - freeze_encoder_epochs 10
#   - unfreeze_encoder_lr_scale 0.1
#   (all other hyperparams identical)
#
# Checkpoint saved to: /data/experiments/models/exp43_how2sign_flat_ctc_bpe1000_freeze_unfreeze/
apiVersion: batch/v1
kind: Job
metadata:
  name: train-exp43-how2sign-flat-ctc-bpe1000-freeze-unfreeze
  namespace: gai-lina-group
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 864000
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: trainer
        image: ghcr.io/kagozi/slt:latest
        command: ["python", "train.py"]
        args:
          - "--dataset"
          - "how2sign"
          - "--root_dir"
          - "/data/hf_cache/How2Sign_Holistic/how2sign_holistic_features"
          - "--output_dir"
          - "/data/experiments"
          - "--exp_name"
          - "exp43_how2sign_flat_ctc_bpe1000_freeze_unfreeze"
          - "--epochs"
          - "500"
          - "--decode"
          - "beam"
          - "--beam_width"
          - "4"
          - "--length_penalty"
          - "1.5"
          - "--batch_size"
          - "8"
          - "--grad_accum"
          - "2"
          - "--fp16"
          - "--dim"
          - "256"
          - "--lr"
          - "3e-4"
          - "--dropout"
          - "0.2"
          - "--num_workers"
          - "4"
          - "--unglossed_ctc_target"
          - "translation"
          - "--bpe_tokenizer_path"
          - "/data/experiments/models/exp39_youtube_asl_flat_ctc_bpe1000/bpe_tokenizer_exp39_youtube_asl_flat_ctc_bpe1000.json"
          - "--pretrained_path"
          - "/data/experiments/models/exp39_youtube_asl_flat_ctc_bpe1000/best_model.pt"
          - "--freeze_strategy"
          - "none"
          - "--ffn_expand"
          - "4"
          - "--ctc_smoothing"
          - "0.05"
          - "--early_stop_patience"
          - "30"
          - "--freeze_encoder_epochs"
          - "10"
          - "--unfreeze_encoder_lr_scale"
          - "0.1"
        env:
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: wandb-credentials
              key: api-key
        - name: MPLCONFIGDIR
          value: /tmp/matplotlib
        - name: HF_HOME
          value: /data/.hf
        - name: TRANSFORMERS_CACHE
          value: /data/.hf/transformers
        - name: WANDB_CACHE_DIR
          value: /data/.wandb_cache
        resources:
          requests:
            cpu: "2"
            memory: "8Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "2"
            memory: "8Gi"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: slt-data
          mountPath: /data
      volumes:
      - name: slt-data
        persistentVolumeClaim:
          claimName: slt-data
