# Experiment 11: Joint PHOENIX + How2Sign Training (Language-Aware Encoder)
# Uses LanguageAwareSignTransformer with separate CTC heads per language.
# Alternating batches: PHOENIX (lang_id=0) → How2Sign (lang_id=1) → ...
# Language embedding (nn.Embedding(2, dim)) steers encoder per-language.
# Goal: learn a unified cross-lingual sign representation in the shared encoder.
apiVersion: batch/v1
kind: Job
metadata:
  name: train-exp11-joint-training
  namespace: gai-lina-group
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: trainer
        image: ghcr.io/kagozi/slt:latest
        command: ["python", "train_joint.py"]
        args:
          - "--phoenix_dir"
          - "/data/phoenix2014/PHOENIX-2014-T-release-v3/PHOENIX-2014-T"
          - "--how2sign_dir"
          - "/data/hf_cache/How2Sign_Holistic/how2sign_holistic_features"
          - "--output_dir"
          - "/data/experiments"
          - "--exp_name"
          - "exp11_joint_training"
          - "--epochs"
          - "150"
          - "--decode"
          - "beam"
          - "--beam_width"
          - "10"
          - "--batch_size"
          - "16"
          - "--dim"
          - "256"
          - "--max_frames"
          - "300"
          - "--num_workers"
          - "4"
          - "--dropout"
          - "0.3"
          - "--lr"
          - "1e-3"
        env:
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: wandb-credentials
              key: api-key
        resources:
          requests:
            cpu: "4"
            memory: "24Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "4"
            memory: "24Gi"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: slt-data
          mountPath: /data
      volumes:
      - name: slt-data
        persistentVolumeClaim:
          claimName: slt-data
