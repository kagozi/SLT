# Experiment 41: How2Sign — Flat CTC BPE-500, v2 (improved decoding)
#
# Redo of Exp 38 with three targeted fixes from post-hoc analysis:
#
#   1. beam_width 4 instead of 10 — beam sweep on Exp 38 showed BLEU-4 peaks at
#      beam=4 (0.4046 test); larger beams gave no gain and worsened WER.
#
#   2. length_penalty 1.5 — Exp 38 predictions were systematically too long
#      (WER>100% at all beam widths), caused by beam search favouring long outputs.
#      Raising the length-normalization exponent from 1.0 → 1.5 penalises longer
#      sequences more during pruning and final selection.
#
#   3. early_stop_patience 30 — Exp 38 best model was at epoch 19; 50-epoch
#      patience just extended wallclock time without benefit.
#
# All other hyperparameters are identical to Exp 38.
# Checkpoint saved to: /data/experiments/models/exp41_how2sign_flat_ctc_bpe500_v2/
apiVersion: batch/v1
kind: Job
metadata:
  name: train-exp41-how2sign-flat-ctc-bpe500-v2
  namespace: gai-lina-group
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 864000
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: trainer
        image: ghcr.io/kagozi/slt:latest
        command: ["python", "train.py"]
        args:
          - "--dataset"
          - "how2sign"
          - "--root_dir"
          - "/data/hf_cache/How2Sign_Holistic/how2sign_holistic_features"
          - "--output_dir"
          - "/data/experiments"
          - "--exp_name"
          - "exp41_how2sign_flat_ctc_bpe500_v2"
          - "--epochs"
          - "500"
          - "--decode"
          - "beam"
          - "--beam_width"
          - "4"
          - "--length_penalty"
          - "1.5"
          - "--batch_size"
          - "8"
          - "--grad_accum"
          - "2"
          - "--fp16"
          - "--dim"
          - "256"
          - "--lr"
          - "1e-3"
          - "--dropout"
          - "0.3"
          - "--num_workers"
          - "4"
          - "--unglossed_ctc_target"
          - "translation"
          - "--ctc_tokenizer"
          - "bpe"
          - "--bpe_vocab_size"
          - "500"
          - "--ffn_expand"
          - "4"
          - "--ctc_smoothing"
          - "0.1"
          - "--early_stop_patience"
          - "30"
        env:
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: wandb-credentials
              key: api-key
        - name: MPLCONFIGDIR
          value: /tmp/matplotlib
        - name: HF_HOME
          value: /data/.hf
        - name: TRANSFORMERS_CACHE
          value: /data/.hf/transformers
        - name: WANDB_CACHE_DIR
          value: /data/.wandb_cache
        resources:
          requests:
            cpu: "2"
            memory: "8Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "2"
            memory: "8Gi"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: slt-data
          mountPath: /data
      volumes:
      - name: slt-data
        persistentVolumeClaim:
          claimName: slt-data
