# Experiment 21: YouTube-ASL → How2Sign Fine-tune (keyword CTC + BART)
#
# Fine-tunes the Exp20 YouTube-ASL checkpoint on How2Sign with the full
# multistream + keyword CTC + mBART pipeline. All layers are trainable.
#
# Target comparison (How2Sign BLEU-4):
#   Exp 18 (scratch)              — baseline
#   Exp 9  (PHOENIX → How2Sign)   — cross-lingual transfer
#   Exp 21 (YouTube-ASL → H2S)   — expected strongest (same language, massive scale)
#
# Depends on: Exp 20 checkpoint at
#   /data/experiments/models/exp20_youtube_asl_pretrain/best_exp20_youtube_asl_pretrain.pt
apiVersion: batch/v1
kind: Job
metadata:
  name: train-exp21-youtube-asl-to-how2sign
  namespace: gai-lina-group
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 864000
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: trainer
        image: ghcr.io/kagozi/slt:latest
        command: ["python", "train.py"]
        args:
          - "--dataset"
          - "how2sign"
          - "--root_dir"
          - "/data/hf_cache/How2Sign_Holistic/how2sign_holistic_features"
          - "--output_dir"
          - "/data/experiments"
          - "--exp_name"
          - "exp21_youtube_asl_to_how2sign"
          - "--epochs"
          - "120"
          - "--decode"
          - "beam"
          - "--beam_width"
          - "4"
          - "--batch_size"
          - "16"
          - "--grad_accum"
          - "2"
          - "--fp16"
          - "--dim"
          - "256"
          - "--max_frames"
          - "300"
          - "--num_workers"
          - "2"
          - "--multistream"
          - "--use_bart"
          - "--ctc_weight"
          - "0.3"
          - "--freeze_bart_epochs"
          - "0"
          - "--ffn_expand"
          - "4"
          - "--lr"
          - "5e-5"
          - "--dropout"
          - "0.3"
          - "--label_smoothing"
          - "0.1"
          - "--contrastive_weight"
          - "0.05"
          - "--ctc_smoothing"
          - "0.0"
          - "--early_stop_patience"
          - "12"
          - "--pretrained_path"
          - "/data/experiments/models/exp20_youtube_asl_pretrain/best_exp20_youtube_asl_pretrain.pt"
          - "--freeze_strategy"
          - "none"
          - "--unglossed_min_freq"
          - "5"
          - "--unglossed_ctc_target"
          - "translation_keywords"
        env:
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: wandb-credentials
              key: api-key
        - name: MPLCONFIGDIR
          value: /tmp/matplotlib
        - name: HF_HOME
          value: /data/.hf
        - name: TRANSFORMERS_CACHE
          value: /data/.hf/transformers
        - name: WANDB_CACHE_DIR
          value: /data/.wandb_cache
        resources:
          requests:
            cpu: "2"
            memory: "9Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "2"
            memory: "10Gi"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: slt-data
          mountPath: /data
      volumes:
      - name: slt-data
        persistentVolumeClaim:
          claimName: slt-data
