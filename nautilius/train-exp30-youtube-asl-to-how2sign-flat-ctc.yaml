# Experiment 30: YouTube-ASL → How2Sign — Flat CTC Transfer
#
# Fine-tunes the Exp 28 (YouTube-ASL flat CTC) checkpoint on How2Sign.
# The encoder is warm-started from Exp 28; the CTC head is re-initialized
# (vocab mismatch between YouTube-ASL and How2Sign English targets).
#
# Mirrors Exp 21 (YouTube-ASL → How2Sign with BART) but CTC-only,
# enabling a clean comparison within the CTC-on-text paradigm:
#   Exp 26 (How2Sign scratch)  vs  Exp 30 (YouTube-ASL pretrained)
#
# ⚠️  DO NOT SUBMIT until Exp 28 checkpoint exists at:
#   /data/experiments/models/exp28_youtube_asl_flat_ctc_english/best_exp28_youtube_asl_flat_ctc_english.pt
#
# Checkpoint saved to: /data/experiments/models/exp30_youtube_asl_to_how2sign_flat_ctc/
apiVersion: batch/v1
kind: Job
metadata:
  name: train-exp30-youtube-asl-to-how2sign-flat-ctc
  namespace: gai-lina-group
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 864000
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: trainer
        image: ghcr.io/kagozi/slt:latest
        command: ["python", "train.py"]
        args:
          - "--dataset"
          - "how2sign"
          - "--root_dir"
          - "/data/hf_cache/How2Sign_Holistic/how2sign_holistic_features"
          - "--output_dir"
          - "/data/experiments"
          - "--exp_name"
          - "exp30_youtube_asl_to_how2sign_flat_ctc"
          - "--epochs"
          - "200"
          - "--decode"
          - "beam"
          - "--beam_width"
          - "10"
          - "--batch_size"
          - "8"
          - "--grad_accum"
          - "2"
          - "--fp16"
          - "--dim"
          - "256"
          - "--max_frames"
          - "300"
          - "--lr"
          - "3e-4"
          - "--dropout"
          - "0.3"
          - "--num_workers"
          - "4"
          - "--unglossed_ctc_target"
          - "translation"
          - "--ffn_expand"
          - "4"
          - "--ctc_smoothing"
          - "0.1"
          - "--early_stop_patience"
          - "50"
          - "--pretrained_path"
          - "/data/experiments/models/exp28_youtube_asl_flat_ctc_english/best_exp28_youtube_asl_flat_ctc_english.pt"
          - "--freeze_strategy"
          - "none"
        env:
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: wandb-credentials
              key: api-key
        - name: MPLCONFIGDIR
          value: /tmp/matplotlib
        - name: HF_HOME
          value: /data/.hf
        - name: TRANSFORMERS_CACHE
          value: /data/.hf/transformers
        - name: WANDB_CACHE_DIR
          value: /data/.wandb_cache
        resources:
          requests:
            cpu: "2"
            memory: "8Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "2"
            memory: "8Gi"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: slt-data
          mountPath: /data
      volumes:
      - name: slt-data
        persistentVolumeClaim:
          claimName: slt-data
