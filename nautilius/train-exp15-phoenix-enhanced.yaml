# Experiment 15: PHOENIX-2014-T — Enhanced flat encoder
# Flat 225-d encoder + velocity features (use_motion) + CTC smoothing +
# contrastive loss (NT-Xent, w=0.1) + R-Drop (w=5.0).
# Direct upgrade over Exp 2 (same CTC+mBART pipeline, same hyperparams).
# Ablation: use_motion contributes ~1-2 BLEU, contrastive ~1-2, R-Drop ~1-2 WER.
apiVersion: batch/v1
kind: Job
metadata:
  name: train-exp15-phoenix-enhanced
  namespace: gai-lina-group
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 345600
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: trainer
        image: ghcr.io/kagozi/slt:latest
        command: ["python", "train.py"]
        args:
          - "--dataset"
          - "phoenix"
          - "--root_dir"
          - "/data/phoenix2014/PHOENIX-2014-T-release-v3/PHOENIX-2014-T"
          - "--output_dir"
          - "/data/experiments"
          - "--exp_name"
          - "exp15_phoenix_enhanced"
          - "--epochs"
          - "200"
          - "--decode"
          - "beam"
          - "--beam_width"
          - "10"
          - "--batch_size"
          - "2"
          - "--grad_accum"
          - "8"
          - "--fp16"
          - "--dim"
          - "256"
          - "--lr"
          - "2e-4"
          - "--dropout"
          - "0.3"
          - "--num_workers"
          - "4"
          - "--use_bart"
          - "--ctc_weight"
          - "0.5"
          - "--freeze_bart_epochs"
          - "20"
          - "--ffn_expand"
          - "4"
          - "--label_smoothing"
          - "0.1"
          - "--use_motion"
          - "--contrastive_weight"
          - "0.1"
          - "--rdrop_weight"
          - "5.0"
          - "--ctc_smoothing"
          - "0.1"
        env:
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: wandb-credentials
              key: api-key
        - name: MPLCONFIGDIR
          value: /tmp/matplotlib
        - name: HF_HOME
          value: /data/.hf
        - name: TRANSFORMERS_CACHE
          value: /data/.hf/transformers
        - name: WANDB_CACHE_DIR
          value: /data/.wandb_cache
        resources:
          requests:
            cpu: "4"
            memory: "32Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "4"
            memory: "32Gi"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: slt-data
          mountPath: /data
      volumes:
      - name: slt-data
        persistentVolumeClaim:
          claimName: slt-data
