# Experiment 26: How2Sign — Flat Encoder + CTC on English Text
#
# Direct replication of Exp 23 (PHOENIX flat CTC-on-German) on How2Sign (ASL).
# Uses normalized English translation words as the CTC target — no ground-truth
# glosses, no BART decoder. Flat single-stream encoder identical to Exp 23.
#
# This is the controlled baseline for Exp 27 on How2Sign.
# Comparing Exp 26 vs Exp 27 isolates multistream + motion within the same
# CTC-on-text paradigm, mirroring the Exp 23 vs Exp 25 comparison on PHOENIX.
#
# Key differences vs Exp 23 (PHOENIX):
#   - dataset: how2sign (ASL) instead of phoenix (DGS)
#   - CTC target: normalized English text (--unglossed_ctc_target translation)
#   - max_frames: 300 (How2Sign default, vs 250 for PHOENIX)
#
# Hyperparameters are otherwise identical to Exp 23.
#
# Checkpoint saved to: /data/experiments/models/exp26_how2sign_flat_ctc_english/
apiVersion: batch/v1
kind: Job
metadata:
  name: train-exp26-how2sign-flat-ctc-english
  namespace: gai-lina-group
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 864000
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: trainer
        image: ghcr.io/kagozi/slt:latest
        command: ["python", "train.py"]
        args:
          - "--dataset"
          - "how2sign"
          - "--root_dir"
          - "/data/hf_cache/How2Sign_Holistic/how2sign_holistic_features"
          - "--output_dir"
          - "/data/experiments"
          - "--exp_name"
          - "exp26_how2sign_flat_ctc_english"
          - "--epochs"
          - "500"
          - "--decode"
          - "beam"
          - "--beam_width"
          - "10"
          - "--batch_size"
          - "8"
          - "--grad_accum"
          - "2"
          - "--fp16"
          - "--dim"
          - "256"
          - "--lr"
          - "1e-3"
          - "--dropout"
          - "0.3"
          - "--num_workers"
          - "4"
          - "--unglossed_ctc_target"
          - "translation"
          - "--ffn_expand"
          - "4"
          - "--ctc_smoothing"
          - "0.1"
          - "--early_stop_patience"
          - "50"
        env:
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: wandb-credentials
              key: api-key
        - name: MPLCONFIGDIR
          value: /tmp/matplotlib
        - name: HF_HOME
          value: /data/.hf
        - name: TRANSFORMERS_CACHE
          value: /data/.hf/transformers
        - name: WANDB_CACHE_DIR
          value: /data/.wandb_cache
        resources:
          requests:
            cpu: "2"
            memory: "8Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "2"
            memory: "8Gi"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: slt-data
          mountPath: /data
      volumes:
      - name: slt-data
        persistentVolumeClaim:
          claimName: slt-data
