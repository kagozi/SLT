# Experiment 50: PHOENIX-2014-T — Multistream interleaved arch, with velocity, from scratch
#
# Direct comparison to exp25 (sequential multistream + velocity, BLEU-4=12.81).
# Swaps the per-stream block stack from sequential (3 ConvBlocks + 4 shared
# TransformerBlocks) to interleaved (3 ConformerBlocks per stream, each Conv+
# Transformer paired, then 4 shared TransformerBlocks after fusion).
#
# Differences from exp25:
#   - arch: interleaved   (ConformerBlocks per stream)
#   - beam_width: 4       (empirically best in recent exps)
#   - length_penalty: 1.5 (fixes over-generation)
#   - preload_data        (faster I/O)
#
# Checkpoint saved to: /data/experiments/models/exp50_phoenix_multistream_maia_velocity/
apiVersion: batch/v1
kind: Job
metadata:
  name: train-exp50-phoenix-multistream-maia-velocity
  namespace: gai-lina-group
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 864000
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - k8s-haosu-07.sdsc.optiputer.net
                - k8s-chase-ci-03.calit2.optiputer.net
      restartPolicy: Never
      containers:
      - name: trainer
        image: ghcr.io/kagozi/slt:latest
        command: ["python", "train.py"]
        args:
          - "--dataset"
          - "phoenix"
          - "--root_dir"
          - "/data/phoenix2014/PHOENIX-2014-T-release-v3/PHOENIX-2014-T"
          - "--output_dir"
          - "/data/experiments"
          - "--exp_name"
          - "exp50_phoenix_multistream_maia_velocity"
          - "--epochs"
          - "500"
          - "--decode"
          - "beam"
          - "--beam_width"
          - "4"
          - "--length_penalty"
          - "1.5"
          - "--batch_size"
          - "32"
          - "--grad_accum"
          - "1"
          - "--fp16"
          - "--dim"
          - "256"
          - "--lr"
          - "3e-4"
          - "--dropout"
          - "0.2"
          - "--num_workers"
          - "4"
          - "--multistream"
          - "--use_motion"
          - "--arch"
          - "interleaved"
          - "--phoenix_ctc_target"
          - "translation"
          - "--ffn_expand"
          - "4"
          - "--ctc_smoothing"
          - "0.05"
          - "--early_stop_patience"
          - "100"
          - "--preload_data"
        env:
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: wandb-credentials
              key: api-key
        - name: MPLCONFIGDIR
          value: /tmp/matplotlib
        - name: HF_HOME
          value: /data/.hf
        - name: TRANSFORMERS_CACHE
          value: /data/.hf/transformers
        - name: WANDB_CACHE_DIR
          value: /data/.wandb_cache
        resources:
          requests:
            cpu: "2"
            memory: "8Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "2"
            memory: "8Gi"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: slt-data
          mountPath: /data
      volumes:
      - name: slt-data
        persistentVolumeClaim:
          claimName: slt-data
