# Convert PSewmuthu/How2Sign_Holistic (HuggingFace) raw (T, 543, 3) npy arrays.
#
# NOTE: This job is now OBSOLETE. The training pipeline reads directly from
# the HF cache at /data/hf_cache/How2Sign_Holistic/how2sign_holistic_features/.
# No pre-conversion step is needed. Kept for reference only.
#
# What it did:
#   Read  /data/hf_cache/How2Sign_Holistic/how2sign_holistic_features/{split}/frontal/*.npy
#   Write /data/how2sign_hf/raw/{split}/{SENTENCE_NAME}.npy  (same raw arrays, different layout)
#   Write /data/how2sign_hf/annotations/how2sign_{split}.csv (with PSEUDOGLOSS)
#
# All processing (landmark selection, wrist-relative, neck norm) now happens
# on-load in dataset_how2sign.py — no pre-processing needed.
apiVersion: batch/v1
kind: Job
metadata:
  name: convert-holistic-features
  namespace: gai-lina-group
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: converter
        image: ghcr.io/kagozi/slt:latest
        command: ["python", "convert_holistic_features.py"]
        args:
          - "--hf_cache"
          - "/data/hf_cache/How2Sign_Holistic"
          - "--out_dir"
          - "/data/how2sign_hf"
          - "--extract_tmp"
          - "/data/how2sign_hf_extract"
          - "--splits"
          - "train"
          - "val"
          - "test"
        resources:
          requests:
            cpu: "8"
            memory: "16Gi"
          limits:
            cpu: "8"
            memory: "16Gi"
        volumeMounts:
        - name: slt-data
          mountPath: /data
      volumes:
      - name: slt-data
        persistentVolumeClaim:
          claimName: slt-data
