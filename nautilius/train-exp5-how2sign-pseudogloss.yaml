# Experiment 5: How2Sign — POS Pseudo-gloss + BART (joint CTC + BART)
# Run AFTER generate-pseudoglosses job writes PSEUDOGLOSS column to annotations CSVs.
apiVersion: batch/v1
kind: Job
metadata:
  name: train-exp5-how2sign-pseudogloss
  namespace: gai-lina-group
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: trainer
        image: ghcr.io/kagozi/slt:latest
        command: ["python", "train.py"]
        args:
          - "--dataset"
          - "how2sign"
          - "--root_dir"
          - "/data/how2sign_rgb"
          - "--output_dir"
          - "/data/experiments"
          - "--exp_name"
          - "exp5_how2sign_pseudogloss"
          - "--epochs"
          - "150"
          - "--decode"
          - "beam"
          - "--beam_width"
          - "10"
          - "--batch_size"
          - "16"
          - "--dim"
          - "192"
          - "--max_frames"
          - "300"
          - "--num_workers"
          - "4"
          - "--use_bart"
          - "--ctc_weight"
          - "0.5"
          - "--freeze_bart_epochs"
          - "15"
        env:
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: wandb-credentials
              key: api-key
        resources:
          requests:
            cpu: "4"
            memory: "32Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "4"
            memory: "32Gi"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: slt-data
          mountPath: /data
      volumes:
      - name: slt-data
        persistentVolumeClaim:
          claimName: slt-data
