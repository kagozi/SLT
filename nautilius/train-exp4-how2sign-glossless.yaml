# Experiment 4: How2Sign — Glossless Sign2Text (BART only)
# ASL dataset, no gloss labels. Does not require pseudogloss generation.
# Run AFTER preextract-how2sign-keypoints job completes.
apiVersion: batch/v1
kind: Job
metadata:
  name: train-exp4-how2sign-glossless
  namespace: gai-lina-group
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: trainer
        image: ghcr.io/kagozi/slt:latest
        command: ["python", "train.py"]
        args:
          - "--dataset"
          - "how2sign"
          - "--root_dir"
          - "/data/how2sign_rgb"
          - "--output_dir"
          - "/data/experiments"
          - "--exp_name"
          - "exp4_how2sign_glossless"
          - "--epochs"
          - "200"
          - "--decode"
          - "beam"
          - "--beam_width"
          - "10"
          - "--batch_size"
          - "16"
          - "--dim"
          - "256"
          - "--max_frames"
          - "300"
          - "--num_workers"
          - "4"
          - "--use_bart"
          - "--ctc_weight"
          - "0.0"
          - "--freeze_bart_epochs"
          - "0"
        env:
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: wandb-credentials
              key: api-key
        resources:
          requests:
            cpu: "4"
            memory: "32Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "4"
            memory: "32Gi"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: slt-data
          mountPath: /data
      volumes:
      - name: slt-data
        persistentVolumeClaim:
          claimName: slt-data
