# Experiment 4: How2Sign — Glossless Sign2Text baseline (BART only)
# ASL dataset, no gloss/keyword CTC supervision. This is the clean ablation
# against Exp21's keyword-CTC + BART setup.
# Run AFTER How2Sign holistic features are available on the PVC.
apiVersion: batch/v1
kind: Job
metadata:
  name: train-exp4-how2sign-glossless
  namespace: gai-lina-group
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 864000
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: trainer
        image: ghcr.io/kagozi/slt:latest
        command: ["python", "train.py"]
        args:
          - "--dataset"
          - "how2sign"
          - "--root_dir"
          - "/data/hf_cache/How2Sign_Holistic/how2sign_holistic_features"
          - "--output_dir"
          - "/data/experiments"
          - "--exp_name"
          - "exp4_how2sign_glossless"
          - "--epochs"
          - "120"
          - "--decode"
          - "beam"
          - "--beam_width"
          - "4"
          - "--batch_size"
          - "16"
          - "--grad_accum"
          - "2"
          - "--fp16"
          - "--dim"
          - "256"
          - "--lr"
          - "5e-5"
          - "--max_frames"
          - "300"
          - "--num_workers"
          - "2"
          - "--multistream"
          - "--dropout"
          - "0.3"
          - "--use_bart"
          - "--ctc_weight"
          - "0.0"
          - "--freeze_bart_epochs"
          - "0"
          - "--ffn_expand"
          - "4"
          - "--label_smoothing"
          - "0.1"
          - "--contrastive_weight"
          - "0.05"
          - "--ctc_smoothing"
          - "0.0"
          - "--early_stop_patience"
          - "12"
          - "--unglossed_min_freq"
          - "5"
          - "--unglossed_ctc_target"
          - "translation_keywords"
        env:
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: wandb-credentials
              key: api-key
        - name: MPLCONFIGDIR
          value: /tmp/matplotlib
        - name: HF_HOME
          value: /data/.hf
        - name: TRANSFORMERS_CACHE
          value: /data/.hf/transformers
        - name: WANDB_CACHE_DIR
          value: /data/.wandb_cache
        resources:
          requests:
            cpu: "2"
            memory: "9Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "2"
            memory: "10Gi"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: slt-data
          mountPath: /data
      volumes:
      - name: slt-data
        persistentVolumeClaim:
          claimName: slt-data
