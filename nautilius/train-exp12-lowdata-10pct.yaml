# Transfer Track B1
# Experiment 12: How2Sign — Low-data Transfer (10% training data, multistream)
# Pretrained from Exp 17 (PHOENIX multistream). Full fine-tune on 10% of How2Sign train set.
# Tests practical utility: how much ASL data is needed given DGS pretraining?
# Depends on: Exp 17 checkpoint at /data/experiments/models/exp17_phoenix_multistream/best_exp17_phoenix_multistream.pt
apiVersion: batch/v1
kind: Job
metadata:
  name: train-exp12-lowdata-10pct
  namespace: gai-lina-group
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 259200
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: trainer
        image: ghcr.io/kagozi/slt:latest
        command: ["python", "train.py"]
        args:
          - "--dataset"
          - "how2sign"
          - "--root_dir"
          - "/data/hf_cache/How2Sign_Holistic/how2sign_holistic_features"
          - "--output_dir"
          - "/data/experiments"
          - "--exp_name"
          - "exp12_lowdata_10pct"
          - "--epochs"
          - "100"
          - "--decode"
          - "beam"
          - "--beam_width"
          - "10"
          - "--batch_size"
          - "4"
          - "--grad_accum"
          - "4"
          - "--fp16"
          - "--dim"
          - "256"
          - "--max_frames"
          - "300"
          - "--num_workers"
          - "4"
          - "--multistream"
          - "--dropout"
          - "0.3"
          - "--pretrained_path"
          - "/data/experiments/models/exp17_phoenix_multistream/best_exp17_phoenix_multistream.pt"
          - "--freeze_strategy"
          - "none"
          - "--lr"
          - "1e-4"
          - "--subset_pct"
          - "10"
        env:
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: wandb-credentials
              key: api-key
        - name: MPLCONFIGDIR
          value: /tmp/matplotlib
        - name: HF_HOME
          value: /data/.hf
        - name: TRANSFORMERS_CACHE
          value: /data/.hf/transformers
        - name: WANDB_CACHE_DIR
          value: /data/.wandb_cache
        resources:
          requests:
            cpu: "2"
            memory: "12Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "2"
            memory: "14Gi"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: slt-data
          mountPath: /data
      volumes:
      - name: slt-data
        persistentVolumeClaim:
          claimName: slt-data
