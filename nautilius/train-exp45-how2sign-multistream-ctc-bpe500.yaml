# Experiment 45: How2Sign — Multistream CTC English BPE-500 (Glossless)
#
# BPE replication of Exp 35 (How2Sign multistream CTC, word-level English).
# Tests whether the BPE vocabulary gain (established in Exp 38→41 for flat CTC)
# compounds with the multistream encoder's stream-separation benefit.
#
# Architecture (same as Exp 35):
#   --arch interleaved --multistream:
#     4 body-part streams (pose/lhand/rhand/face), each through 3 ConformerBlocks
#     (Conv+Transformer, kernels 11/5/11) with per-stream velocity features.
#     Fused via cross-stream attention, then 4 shared TransformerBlocks.
#
# Differences from Exp 35:
#   - ctc_tokenizer bpe, bpe_vocab_size 500
#   - beam_width 4         (empirically best from Exp 38/41 sweep)
#   - length_penalty 1.5   (fixes over-generation)
#   - early_stop_patience 30  (reduced from 100; BPE converges faster)
#
# Checkpoint saved to: /data/experiments/models/exp45_how2sign_multistream_ctc_bpe500/
apiVersion: batch/v1
kind: Job
metadata:
  name: train-exp45-how2sign-multistream-ctc-bpe500
  namespace: gai-lina-group
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 864000
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - k8s-haosu-07.sdsc.optiputer.net
                - k8s-haosu-05.sdsc.optiputer.net
                - k8s-haosu-10.sdsc.optiputer.net
                - k8s-haosu-19.sdsc.optiputer.net
                - k8s-4090-01.calit2.optiputer.net
                - k8s-chase-ci-03.calit2.optiputer.net
      restartPolicy: Never
      containers:
      - name: trainer
        image: ghcr.io/kagozi/slt:latest
        command: ["python", "train.py"]
        args:
          - "--dataset"
          - "how2sign"
          - "--root_dir"
          - "/data/hf_cache/How2Sign_Holistic/how2sign_holistic_features"
          - "--output_dir"
          - "/data/experiments"
          - "--exp_name"
          - "exp45_how2sign_multistream_ctc_bpe500"
          - "--epochs"
          - "500"
          - "--decode"
          - "beam"
          - "--beam_width"
          - "4"
          - "--length_penalty"
          - "1.5"
          - "--batch_size"
          - "32"
          - "--grad_accum"
          - "1"
          - "--fp16"
          - "--dim"
          - "384"
          - "--lr"
          - "2e-4"
          - "--dropout"
          - "0.2"
          - "--num_workers"
          - "4"
          - "--arch"
          - "interleaved"
          - "--multistream"
          - "--unglossed_ctc_target"
          - "translation"
          - "--ctc_tokenizer"
          - "bpe"
          - "--bpe_vocab_size"
          - "500"
          - "--ffn_expand"
          - "2"
          - "--max_frames"
          - "180"
          - "--ctc_smoothing"
          - "0.05"
          - "--early_stop_patience"
          - "30"
          - "--preload_data"
        env:
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: wandb-credentials
              key: api-key
        - name: MPLCONFIGDIR
          value: /tmp/matplotlib
        - name: HF_HOME
          value: /data/.hf
        - name: TRANSFORMERS_CACHE
          value: /data/.hf/transformers
        - name: WANDB_CACHE_DIR
          value: /data/.wandb_cache
        resources:
          requests:
            cpu: "1"
            memory: "16Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "1"
            memory: "16Gi"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: slt-data
          mountPath: /data
      volumes:
      - name: slt-data
        persistentVolumeClaim:
          claimName: slt-data
