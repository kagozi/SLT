# Experiment 10: How2Sign — Scratch Baseline (Transfer Control)
# Identical hyperparameters to Exp 9 but NO pretrained weights.
# Control experiment: measures how much Exps 7-9 benefit from PHOENIX pretraining.
apiVersion: batch/v1
kind: Job
metadata:
  name: train-exp10-transfer-scratch
  namespace: gai-lina-group
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: trainer
        image: ghcr.io/kagozi/slt:latest
        command: ["python", "train.py"]
        args:
          - "--dataset"
          - "how2sign"
          - "--root_dir"
          - "/data/how2sign_rgb"
          - "--output_dir"
          - "/data/experiments"
          - "--exp_name"
          - "exp10_transfer_scratch"
          - "--epochs"
          - "100"
          - "--decode"
          - "beam"
          - "--beam_width"
          - "10"
          - "--batch_size"
          - "16"
          - "--dim"
          - "256"
          - "--max_frames"
          - "300"
          - "--num_workers"
          - "4"
          - "--dropout"
          - "0.3"
          - "--lr"
          - "1e-3"
        env:
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: wandb-credentials
              key: api-key
        resources:
          requests:
            cpu: "4"
            memory: "16Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "4"
            memory: "16Gi"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: slt-data
          mountPath: /data
      volumes:
      - name: slt-data
        persistentVolumeClaim:
          claimName: slt-data
