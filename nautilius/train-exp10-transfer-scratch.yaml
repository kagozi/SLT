# Experiment 10: How2Sign — Scratch keyword-CTC baseline
# No pretrained weights. Uses the corrected English keyword CTC target for
# How2Sign, with a reduced weak-target vocabulary to avoid blank collapse.
apiVersion: batch/v1
kind: Job
metadata:
  name: train-exp10-transfer-scratch
  namespace: gai-lina-group
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 432000
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: trainer
        image: ghcr.io/kagozi/slt:latest
        command: ["python", "train.py"]
        args:
          - "--dataset"
          - "how2sign"
          - "--root_dir"
          - "/data/hf_cache/How2Sign_Holistic/how2sign_holistic_features"
          - "--output_dir"
          - "/data/experiments"
          - "--exp_name"
          - "exp10_transfer_scratch"
          - "--epochs"
          - "100"
          - "--decode"
          - "beam"
          - "--beam_width"
          - "4"
          - "--batch_size"
          - "32"
          - "--grad_accum"
          - "2"
          - "--fp16"
          - "--dim"
          - "256"
          - "--max_frames"
          - "300"
          - "--num_workers"
          - "2"
          - "--multistream"
          - "--dropout"
          - "0.3"
          - "--lr"
          - "5e-5"
          - "--ctc_smoothing"
          - "0.0"
          - "--early_stop_patience"
          - "12"
          - "--unglossed_min_freq"
          - "5"
          - "--unglossed_ctc_target"
          - "translation_keywords"
        env:
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: wandb-credentials
              key: api-key
        - name: MPLCONFIGDIR
          value: /tmp/matplotlib
        - name: HF_HOME
          value: /data/.hf
        - name: TRANSFORMERS_CACHE
          value: /data/.hf/transformers
        - name: WANDB_CACHE_DIR
          value: /data/.wandb_cache
        resources:
          requests:
            cpu: "2"
            memory: "9Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "2"
            memory: "10Gi"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: slt-data
          mountPath: /data
      volumes:
      - name: slt-data
        persistentVolumeClaim:
          claimName: slt-data
