# Experiment 32: PHOENIX-2014-T — Multistream Sign2Gloss2Text (Maia et al. replication)
#
# Replicates the traditional Sign2Gloss2Text pipeline from Maia et al. (Sign2German)
# using the multistream encoder:
#   Sign → multistream CTC on ground-truth GLOSS tokens → mBART → German text
#
# This is the complement to Exp 23/25 (glossless CTC-on-text):
#   Exp 23/25: no gloss annotations, CTC target = German text words directly
#   Exp 32:    gloss annotations used, multistream CTC gloss + mBART translation
#
# Multistream replaces the flat encoder to match our best recognition backbone
# (Exp 19/22 showed multistream >> flat for Sign2Gloss and Sign2Gloss2Text).
#
# Architecture:
#   keypoints → multistream encoder (pose/lhand/rhand/face + motion)
#             → CTC gloss head (auxiliary)
#             → mBART decoder (receives encoder hidden states)
#
# Three-stage training (as in Maia repo):
#   Stage 1 (epochs 0-20):   CTC-only, mBART frozen
#   Stage 2 (epochs 20-40):  mBART unfreezes, encoder detached
#   Stage 3 (remaining):     Full joint fine-tuning
#
# Differences from Exp 2 (flat Sign2Gloss2Text):
#   - multistream encoder
#   - ctc_smoothing=0.1
#   - early_stop_patience=50
#   - ctc_weight=0.3 (matches Maia's paper default)
#   - dropout=0.2
#
# Checkpoint saved to: /data/experiments/models/exp32_phoenix_multistream_sign2gloss2text_maia/
apiVersion: batch/v1
kind: Job
metadata:
  name: train-exp32-phoenix-sign2gloss2text-maia
  namespace: gai-lina-group
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 864000
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: trainer
        image: ghcr.io/kagozi/slt:latest
        command: ["python", "train.py"]
        args:
          - "--dataset"
          - "phoenix"
          - "--root_dir"
          - "/data/phoenix2014/PHOENIX-2014-T-release-v3/PHOENIX-2014-T"
          - "--output_dir"
          - "/data/experiments"
          - "--exp_name"
          - "exp32_phoenix_sign2gloss2text_maia"
          - "--epochs"
          - "500"
          - "--decode"
          - "beam"
          - "--beam_width"
          - "10"
          - "--batch_size"
          - "4"
          - "--grad_accum"
          - "4"
          - "--fp16"
          - "--dim"
          - "256"
          - "--lr"
          - "1e-3"
          - "--dropout"
          - "0.2"
          - "--num_workers"
          - "4"
          - "--multistream"
          - "--use_bart"
          - "--phoenix_ctc_target"
          - "gloss"
          - "--ctc_weight"
          - "0.3"
          - "--freeze_bart_epochs"
          - "20"
          - "--warmup_bart_epochs"
          - "20"
          - "--joint_encoder_lr_scale"
          - "0.2"
          - "--joint_bart_lr_scale"
          - "0.5"
          - "--ffn_expand"
          - "4"
          - "--label_smoothing"
          - "0.1"
          - "--ctc_smoothing"
          - "0.1"
          - "--early_stop_patience"
          - "50"
        env:
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: wandb-credentials
              key: api-key
        - name: MPLCONFIGDIR
          value: /tmp/matplotlib
        - name: HF_HOME
          value: /data/.hf
        - name: TRANSFORMERS_CACHE
          value: /data/.hf/transformers
        - name: WANDB_CACHE_DIR
          value: /data/.wandb_cache
        resources:
          requests:
            cpu: "2"
            memory: "16Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "2"
            memory: "16Gi"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: slt-data
          mountPath: /data
      volumes:
      - name: slt-data
        persistentVolumeClaim:
          claimName: slt-data
