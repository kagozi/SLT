# Experiment 36: PHOENIX-2014-T — Maia-Style Flat CTC German (True Replication)
#
# True replication of Maia et al. (Sign2German) architecture on PHOENIX-2014-T,
# using the same hyperparameter spec as Exp 34 (How2Sign Maia replication).
#
# Maia-matched specs:
#   --arch interleaved  → 6 ConformerBlocks (Conv+Transformer pairs, kernels 11,5 alternating)
#   --dim 384           → matches Maia
#   --ffn_expand 2      → matches Maia
#   --lr 4e-4           → matches Maia
#   --dropout 0.1       → Maia uses minimal regularisation
#
# Note: Exp 23 is NOT a Maia replication — it uses dim=256, ffn_expand=4, lr=1e-3.
# This experiment establishes the true Maia baseline for PHOENIX.
#
# Serves as the flat baseline for Exp 37 (multistream + motion improvement).
# Checkpoint saved to: /data/experiments/models/exp36_phoenix_maia_flat_ctc_german/
apiVersion: batch/v1
kind: Job
metadata:
  name: train-exp36-phoenix-maia-flat-ctc-german
  namespace: gai-lina-group
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 864000
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: trainer
        image: ghcr.io/kagozi/slt:latest
        command: ["python", "train.py"]
        args:
          - "--dataset"
          - "phoenix"
          - "--root_dir"
          - "/data/phoenix2014/PHOENIX-2014-T-release-v3/PHOENIX-2014-T"
          - "--output_dir"
          - "/data/experiments"
          - "--exp_name"
          - "exp36_phoenix_maia_flat_ctc_german"
          - "--epochs"
          - "500"
          - "--decode"
          - "beam"
          - "--beam_width"
          - "10"
          - "--batch_size"
          - "8"
          - "--grad_accum"
          - "2"
          - "--fp16"
          - "--dim"
          - "384"
          - "--lr"
          - "4e-4"
          - "--dropout"
          - "0.1"
          - "--num_workers"
          - "4"
          - "--arch"
          - "interleaved"
          - "--phoenix_ctc_target"
          - "translation"
          - "--ffn_expand"
          - "2"
          - "--ctc_smoothing"
          - "0.1"
          - "--early_stop_patience"
          - "50"
        env:
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: wandb-credentials
              key: api-key
        - name: MPLCONFIGDIR
          value: /tmp/matplotlib
        - name: HF_HOME
          value: /data/.hf
        - name: TRANSFORMERS_CACHE
          value: /data/.hf/transformers
        - name: WANDB_CACHE_DIR
          value: /data/.wandb_cache
        resources:
          requests:
            cpu: "2"
            memory: "8Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "2"
            memory: "8Gi"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: slt-data
          mountPath: /data
      volumes:
      - name: slt-data
        persistentVolumeClaim:
          claimName: slt-data
