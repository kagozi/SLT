# Experiment 34: How2Sign — Maia-Style Flat CTC English (True Replication)
#
# True replication of Maia et al. (ASL2Text.ipynb) in our PyTorch framework,
# including the interleaved Conv+Transformer block architecture.
#
# Maia's notebook key specs (TensorFlow, ASL subset):
#   dim=384, FFN expand=2, lr=4e-4, wd=1e-4, FRAME_LEN=180
#   6 interleaved [Conv(k=11/5) + Transformer] blocks
#   CTC on English text
#
# How this maps to our flags:
#   --arch interleaved  → 6 ConformerBlocks (Conv+Transformer pairs, kernels 11,5 alternating)
#   --dim 384           → matches Maia
#   --ffn_expand 2      → matches Maia
#   --lr 4e-4           → matches Maia
#   --max_frames 180    → matches Maia FRAME_LEN
#   --dropout 0.1       → Maia uses minimal regularisation
#
# Serves as the proven baseline for Exp 35 (multistream + motion improvement).
# Checkpoint saved to: /data/experiments/models/exp34_how2sign_maia_flat_ctc_english/
apiVersion: batch/v1
kind: Job
metadata:
  name: train-exp34-how2sign-maia-flat-ctc-english
  namespace: gai-lina-group
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 864000
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: trainer
        image: ghcr.io/kagozi/slt:latest
        command: ["python", "train.py"]
        args:
          - "--dataset"
          - "how2sign"
          - "--root_dir"
          - "/data/hf_cache/How2Sign_Holistic/how2sign_holistic_features"
          - "--output_dir"
          - "/data/experiments"
          - "--exp_name"
          - "exp34_how2sign_maia_flat_ctc_english"
          - "--epochs"
          - "500"
          - "--decode"
          - "beam"
          - "--beam_width"
          - "10"
          - "--batch_size"
          - "8"
          - "--grad_accum"
          - "2"
          - "--fp16"
          - "--dim"
          - "384"
          - "--lr"
          - "4e-4"
          - "--dropout"
          - "0.1"
          - "--num_workers"
          - "4"
          - "--arch"
          - "interleaved"
          - "--unglossed_ctc_target"
          - "translation"
          - "--ffn_expand"
          - "2"
          - "--max_frames"
          - "180"
          - "--ctc_smoothing"
          - "0.1"
          - "--early_stop_patience"
          - "50"
        env:
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: wandb-credentials
              key: api-key
        - name: MPLCONFIGDIR
          value: /tmp/matplotlib
        - name: HF_HOME
          value: /data/.hf
        - name: TRANSFORMERS_CACHE
          value: /data/.hf/transformers
        - name: WANDB_CACHE_DIR
          value: /data/.wandb_cache
        resources:
          requests:
            cpu: "2"
            memory: "8Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "2"
            memory: "8Gi"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: slt-data
          mountPath: /data
      volumes:
      - name: slt-data
        persistentVolumeClaim:
          claimName: slt-data
