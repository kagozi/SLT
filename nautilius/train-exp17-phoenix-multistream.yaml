# Priority 2
# Experiment 17: PHOENIX-2014-T — Multi-stream encoder
# MultiStreamSignLanguageTransformer: 4 body-part streams (pose/lhand/rhand/face)
# with per-stream velocity, separate ConvBlocks, cross-stream attention fusion,
# then shared TransformerBlocks + CTC + mBART.
# Updated for the repaired codepath: decoder/language are resolved in code and
# regularisation is less aggressive than the previous runs.
# Use results to decide freeze strategy for Exp 7-9 (transfer experiments).
apiVersion: batch/v1
kind: Job
metadata:
  name: train-exp17-phoenix-multistream
  namespace: gai-lina-group
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 864000
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: trainer
        image: ghcr.io/kagozi/slt:latest
        command: ["python", "train.py"]
        args:
          - "--dataset"
          - "phoenix"
          - "--root_dir"
          - "/data/phoenix2014/PHOENIX-2014-T-release-v3/PHOENIX-2014-T"
          - "--output_dir"
          - "/data/experiments"
          - "--exp_name"
          - "exp17_phoenix_multistream"
          - "--epochs"
          - "500"
          - "--decode"
          - "beam"
          - "--beam_width"
          - "10"
          - "--batch_size"
          - "1"
          - "--grad_accum"
          - "16"
          - "--fp16"
          - "--dim"
          - "256"
          - "--lr"
          - "2e-4"
          - "--dropout"
          - "0.3"
          - "--num_workers"
          - "4"
          - "--multistream"
          - "--use_bart"
          - "--ctc_weight"
          - "0.5"
          - "--freeze_bart_epochs"
          - "20"
          - "--warmup_bart_epochs"
          - "20"
          - "--joint_encoder_lr_scale"
          - "0.2"
          - "--joint_bart_lr_scale"
          - "0.5"
          - "--ffn_expand"
          - "4"
          - "--label_smoothing"
          - "0.1"
          - "--ctc_smoothing"
          - "0.1"
        env:
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: wandb-credentials
              key: api-key
        - name: MPLCONFIGDIR
          value: /tmp/matplotlib
        - name: HF_HOME
          value: /data/.hf
        - name: TRANSFORMERS_CACHE
          value: /data/.hf/transformers
        - name: WANDB_CACHE_DIR
          value: /data/.wandb_cache
        resources:
          requests:
            cpu: "4"
            memory: "40Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "4"
            memory: "40Gi"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: slt-data
          mountPath: /data
      volumes:
      - name: slt-data
        persistentVolumeClaim:
          claimName: slt-data
