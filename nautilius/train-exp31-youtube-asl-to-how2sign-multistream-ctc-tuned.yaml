# Experiment 31: YouTube-ASL → How2Sign — Multistream CTC Transfer (tuned)
#
# Fine-tunes the Exp 29 (YouTube-ASL multistream CTC tuned) checkpoint on How2Sign.
# The encoder is warm-started from Exp 29; the CTC head is re-initialized
# (vocab mismatch between YouTube-ASL and How2Sign English targets).
#
# Enables a clean comparison within the CTC-on-text paradigm:
#   Exp 27 (How2Sign multistream scratch)  vs  Exp 31 (YouTube-ASL pretrained)
#
# Tuned fine-tuning LR (1e-4) to prevent catastrophic forgetting of the
# pretrained multistream representations.
#
# ⚠️  DO NOT SUBMIT until Exp 29 checkpoint exists at:
#   /data/experiments/models/exp29_youtube_asl_multistream_ctc_english_tuned/best_exp29_youtube_asl_multistream_ctc_english_tuned.pt
#
# Checkpoint saved to: /data/experiments/models/exp31_youtube_asl_to_how2sign_multistream_ctc_tuned/
apiVersion: batch/v1
kind: Job
metadata:
  name: train-exp31-youtube-asl-to-how2sign-multistream-ctc-tuned
  namespace: gai-lina-group
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 864000
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: trainer
        image: ghcr.io/kagozi/slt:latest
        command: ["python", "train.py"]
        args:
          - "--dataset"
          - "how2sign"
          - "--root_dir"
          - "/data/hf_cache/How2Sign_Holistic/how2sign_holistic_features"
          - "--output_dir"
          - "/data/experiments"
          - "--exp_name"
          - "exp31_youtube_asl_to_how2sign_multistream_ctc_tuned"
          - "--epochs"
          - "200"
          - "--decode"
          - "beam"
          - "--beam_width"
          - "10"
          - "--batch_size"
          - "8"
          - "--grad_accum"
          - "2"
          - "--fp16"
          - "--dim"
          - "256"
          - "--max_frames"
          - "300"
          - "--lr"
          - "1e-4"
          - "--dropout"
          - "0.2"
          - "--num_workers"
          - "4"
          - "--multistream"
          - "--unglossed_ctc_target"
          - "translation"
          - "--ffn_expand"
          - "4"
          - "--ctc_smoothing"
          - "0.05"
          - "--early_stop_patience"
          - "50"
          - "--pretrained_path"
          - "/data/experiments/models/exp29_youtube_asl_multistream_ctc_english_tuned/best_exp29_youtube_asl_multistream_ctc_english_tuned.pt"
          - "--freeze_strategy"
          - "none"
        env:
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: wandb-credentials
              key: api-key
        - name: MPLCONFIGDIR
          value: /tmp/matplotlib
        - name: HF_HOME
          value: /data/.hf
        - name: TRANSFORMERS_CACHE
          value: /data/.hf/transformers
        - name: WANDB_CACHE_DIR
          value: /data/.wandb_cache
        resources:
          requests:
            cpu: "2"
            memory: "8Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "2"
            memory: "8Gi"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: slt-data
          mountPath: /data
      volumes:
      - name: slt-data
        persistentVolumeClaim:
          claimName: slt-data
